name: Browser Selector Formatter (one shot)
on:
  push:
    branches: [release/v1.0.0]
    paths: ['.github/workflows/browser-selector-format-once.yml']
permissions:
  contents: write
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: |
          cd web
          bun install --frozen-lockfile
          ./node_modules/.bin/prettier --write src/features/browser/BrowserSurface.tsx src/features/browser/BrowserSurface.module.scss
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/browser-selector-format-once.yml
          git add web/src/features/browser/BrowserSurface.tsx web/src/features/browser/BrowserSurface.module.scss
          git commit -m 'style(browser): format agent browser selector'
          git push origin HEAD:release/v1.0.0
