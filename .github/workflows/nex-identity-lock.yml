name: NEX identity provenance
on:
  pull_request:
    paths:
      - 'docs/design/nex/**'
      - 'docs/design/NEX_*'
      - 'web/src/features/hud/NexPixelSprite.tsx'
      - 'web/public/nex/**'
      - 'scripts/verify-nex-identity-lock.mjs'
  push:
    branches: [release/v1.0.0]
    paths:
      - 'docs/design/nex/**'
      - 'scripts/verify-nex-identity-lock.mjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify identity contract and masters
        run: node scripts/verify-nex-identity-lock.mjs --base-ref origin/release/v1.0.0
