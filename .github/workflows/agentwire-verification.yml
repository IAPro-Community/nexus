name: AgentWire contract and supervisor verification
on:
  push:
    branches: [release/v1.0.0]
    paths:
      - 'internal/control/agentwire/**'
      - 'internal/control/host/**'
      - 'internal/control/launcher/**'
      - 'internal/control/driver/**'
      - 'internal/control/web/handlers_api.go'
      - 'web/src/components/AttentionNotification*'
      - 'web/src/components/attentionToastModel*'
      - 'web/src/app/attentionRadarModel*'
      - 'web/src/app/documentTitle*'
      - 'web/src/features/agents/NewAgentModal.tsx'
      - 'web/src/features/agents/structuredHarnessOptions*'
      - 'web/src/types.ts'
      - '.github/workflows/agentwire-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format staged checkout for validation
        run: |
          # Run all compiler/test steps even if source formatting drifts.
          # The final gate still fails on an unformatted committed file.
          gofmt -w internal/control/agentwire internal/control/host internal/control/driver/harness_preview*.go internal/control/driver/structured_command.go internal/control/driver/launch_config.go internal/control/launcher/launcher.go internal/control/web/handlers_api.go internal/control/web/structured_multiclient_process_e2e_test.go
      - name: Agentwire race and contract tests
        run: go test -race -count=1 ./internal/control/agentwire
      - name: Host, driver, launcher and web API tests
        run: go test -count=1 ./internal/control/host ./internal/control/driver ./internal/control/launcher ./internal/control/web
      - name: Process-backed integration and cross-client E2E
        run: |
          go test -count=1 -timeout 5m ./internal/control/host -run 'TestSessionHostKeepsNativePermissionUntilAuthoritativeSettlement'
          go test -count=1 -timeout 5m ./internal/control/web -run 'TestTwoSupervisedACPProcessesAndTwoAuthenticatedHTTPClients'
      - name: Build affected packages
        run: go build ./internal/control/agentwire ./internal/control/host ./internal/control/launcher ./internal/control/driver ./internal/control/web
      - name: Verify committed gofmt parity
        if: always()
        run: |
          if ! git diff --quiet; then
            git diff --stat
            echo '::error::Committed Go source needs gofmt'
            exit 1
          fi

  web-attention:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: bun run typecheck
      - name: Attention and provider-picker regressions
        working-directory: web
        run: bunx vitest run src/components/attentionToastModel.test.ts src/components/AttentionNotification.test.ts src/app/attentionRadarModel.test.ts src/app/documentTitle.test.ts src/features/agents/structuredHarnessOptions.test.ts
      - name: Frontend production build
        working-directory: web
        run: bun run build
