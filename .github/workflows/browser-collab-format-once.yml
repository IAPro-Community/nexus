name: Browser collaboration formatting (one shot)
on:
  push:
    branches: [release/v1.0.0]
    paths: ['.github/workflows/browser-collab-format-once.yml']
permissions:
  contents: write
jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.0
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Format Go
        run: |
          gofmt -w internal/browsercontrol/browser.go internal/browsercontrol/browser_collaboration.go internal/browsercontrol/browser_collaboration_test.go internal/control/web/handlers_browser.go internal/control/web/handlers_browser_mcp.go internal/control/web/handlers_browser_mcp_test.go internal/control/web/routes.go
      - name: Format React and SCSS
        run: |
          cd web
          bun install --frozen-lockfile
          ./node_modules/.bin/prettier --write src/features/browser/BrowserSurface.tsx src/features/browser/BrowserSurface.module.scss
      - name: Commit formatted sources and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/browser-collab-format-once.yml
          git add internal/browsercontrol internal/control/web/handlers_browser.go internal/control/web/handlers_browser_mcp.go internal/control/web/handlers_browser_mcp_test.go internal/control/web/routes.go web/src/features/browser
          git commit -m 'style(browser): format human-agent collaboration and MCP endpoints'
          git push origin HEAD:release/v1.0.0
