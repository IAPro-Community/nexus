name: Outputs and Project Files Verification
on:
  push:
    branches: [release/v1.0.0]
    paths:
      - 'internal/nexus/artifacts/**'
      - 'internal/control/web/handlers_project_outputs.go'
      - 'internal/control/web/handlers_output_publish_mcp.go'
      - 'internal/control/web/handlers_browser_mcp.go'
      - 'internal/control/web/routes_projects_agents.go'
      - 'web/src/features/outputs/**'
      - 'web/src/app/surfaces.ts'
      - 'web/src/app/routes.ts'
      - 'web/src/app/WorkspaceSurfaceHost.tsx'
      - 'web/src/app/NexusWorkspaceApp.tsx'
      - 'web/src/features/projects/ProjectRail.tsx'
      - '.github/workflows/nexus-outputs-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Go formatting
        run: test -z "$(gofmt -l internal/nexus/artifacts internal/control/web/handlers_project_outputs.go internal/control/web/handlers_output_publish_mcp.go internal/control/web/handlers_browser_mcp.go internal/control/web/routes_projects_agents.go)"
      - name: Vet and test artifact and web APIs
        run: |
          go vet ./internal/nexus/artifacts ./internal/control/web
          go test ./internal/nexus/artifacts ./internal/control/web -count=1
      - name: Race test artifact service
        run: go test -race ./internal/nexus/artifacts -count=1
      - name: Frontend dependencies
        run: cd web && bun install --frozen-lockfile
      - name: Frontend typecheck
        run: cd web && bun run typecheck
      - name: Frontend build
        run: cd web && bun run build
