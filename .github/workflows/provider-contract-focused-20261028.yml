name: Provider contract focused verification (temporary)
on:
  pull_request:
    branches: [release/v1.0.0]
    paths:
      - internal/control/driver/**
      - web/src/features/agents/**
      - web/src/types.ts
      - .github/workflows/provider-contract-focused-20261028.yml
permissions:
  contents: read
jobs:
  provider-contract:
    name: Provider contract Go and Web tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Test Core capability projection
        run: go test -count=1 ./internal/control/driver
      - name: Install locked Web packages
        run: bun install --cwd web --frozen-lockfile
      - name: Show precise Prettier changes for reviewed files
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          for path in src/features/agents/structuredHarnessOptions.ts src/features/agents/structuredHarnessOptions.test.ts src/features/agents/NewAgentModal.tsx; do
            expected="${RUNNER_TEMP}/$(basename "$path").expected"
            bunx prettier "$path" > "$expected"
            echo "### Prettier diff: $path"
            diff -u "$path" "$expected" || true
          done
      - name: Check TypeScript, lint and formatting
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          bun run typecheck
          bunx eslint src/features/agents/structuredHarnessOptions.ts src/features/agents/structuredHarnessOptions.test.ts src/features/agents/NewAgentModal.tsx src/types.ts
          bunx prettier --check src/features/agents/structuredHarnessOptions.ts src/features/agents/structuredHarnessOptions.test.ts src/features/agents/NewAgentModal.tsx src/types.ts
      - name: Test existing agent selector
        working-directory: web
        run: bunx vitest run src/features/agents/structuredHarnessOptions.test.ts src/features/agents/NewAgentModal.test.tsx
