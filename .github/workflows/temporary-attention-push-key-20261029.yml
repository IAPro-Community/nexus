name: Temporary attention push identity verification
on:
  pull_request:
    branches: [release/v1.0.0]
    paths:
      - web/src/app/NexusWorkspaceApp.tsx
      - web/src/components/attentionToastModel.ts
      - web/src/components/attentionToastModel.test.ts
      - web/src/notifications/attentionDelivery.ts
      - web/src/notifications/attentionDelivery.test.ts
      - .github/workflows/temporary-attention-push-key-20261029.yml
permissions:
  contents: read
jobs:
  focused:
    name: Attention push identity typecheck and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install locked dependencies
        run: bun install --cwd web --frozen-lockfile
      - name: Typecheck, lint, format and unit tests
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          bun run typecheck
          bunx eslint src/app/NexusWorkspaceApp.tsx src/components/attentionToastModel.ts src/components/attentionToastModel.test.ts src/notifications/attentionDelivery.ts src/notifications/attentionDelivery.test.ts
          bunx prettier --check src/app/NexusWorkspaceApp.tsx src/components/attentionToastModel.ts src/components/attentionToastModel.test.ts src/notifications/attentionDelivery.ts src/notifications/attentionDelivery.test.ts
          bunx vitest run src/components/attentionToastModel.test.ts src/notifications/attentionDelivery.test.ts src/components/AttentionNotification.test.ts src/app/attentionRadarModel.test.ts
