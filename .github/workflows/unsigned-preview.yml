name: Unsigned Source Release Preview

# Manual opt-in only. This is NOT the signed production release or updater channel.
# workflow_dispatch is only listed in the UI when this file is on main.
# On release/v1.0.0, an opt-in commit marked [unsigned-preview] triggers it.
on:
  push:
    branches: ['release/v1.0.0']
  workflow_dispatch:
    inputs:
      acceptance_only:
        description: 'Produce hosted platform acceptance evidence without publishing an unsigned preview tag'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nexus-unsigned-preview-${{ github.sha }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  linux:
    name: Linux amd64 unsigned preview
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[unsigned-preview]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Install native Wails build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev pkg-config
          pkg-config --exists gtk+-3.0 webkit2gtk-4.1 libsoup-3.0 gio-unix-2.0
      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          export NEXUS_UPDATE_PUBLIC_KEY="$(tr -d '\r\n[:space:]' < UPDATE_PUBLIC_KEY)"
          test "${#NEXUS_UPDATE_PUBLIC_KEY}" -eq 64
          bun install --cwd web --frozen-lockfile
          bun run --cwd web quality:full
          go test -tags gtk3 -count=1 ./...
          make build
          make build-desktop-wails
          make build-hud-wails
          mkdir -p preview-out/payload
          cp nexus cmd/nexus-desktop/build/bin/nexus-desktop cmd/nexus-hud/build/bin/nexus-hud LICENSE preview-out/payload/
          printf '%s\n' "$GITHUB_SHA" > preview-out/payload/SOURCE_SHA.txt
          test "$(go version -m preview-out/payload/nexus | grep -c 'go1.26.11')" -gt 0
          test -x preview-out/payload/nexus-desktop
          test -x preview-out/payload/nexus-hud
          tar -czf preview-out/nexus-preview-linux-amd64.tar.gz -C preview-out/payload .
          rm -rf preview-out/payload
      - name: Produce V1 workspace acceptance record (linux-amd64)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/workspace-acceptance-e2e.mjs run \
            --platform linux-amd64 \
            --sha "$GITHUB_SHA" \
            --job-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --log-dir "$RUNNER_TEMP/workspace-acceptance-logs" \
            --out "$RUNNER_TEMP/workspace-acceptance-linux-amd64.json" \
            --allow-incomplete
          test -s "$RUNNER_TEMP/workspace-acceptance-linux-amd64.json"
      - name: Upload V1 workspace acceptance record (linux-amd64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-v1-workspace-acceptance-linux-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/workspace-acceptance-linux-amd64.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: preview-linux
          path: preview-out/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows amd64 unsigned preview
    runs-on: windows-2022
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[unsigned-preview]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Verify and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun install --cwd web --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'bun install failed' }
          bun run --cwd web quality:full
          if ($LASTEXITCODE -ne 0) { throw 'frontend quality failed' }
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go tests failed' }
          $version = (Get-Content VERSION -Raw).Trim()
          $commit = (git rev-parse --short HEAD).Trim()
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $module = 'github.com/IAPro-Community/nexus'
          $publicKey = (Get-Content UPDATE_PUBLIC_KEY -Raw).Trim()
          if ($publicKey -notmatch '^[a-fA-F0-9]{64}$') { throw 'Invalid canonical update public key' }
          $ld = "-s -w -X $module/internal/buildinfo.Version=$version -X $module/internal/buildinfo.Commit=$commit -X $module/internal/buildinfo.BuildDate=$date -X $module/internal/update.ProductionTrustRootHex=$publicKey"
          foreach ($target in @(@('nexus','./cmd/nexus'),@('nexus-desktop','./cmd/nexus-desktop'),@('nexus-hud','./cmd/nexus-hud'))) {
            go build -trimpath -buildvcs=false -tags production -ldflags $ld -o "$($target[0]).exe" $target[1]
            if ($LASTEXITCODE -ne 0) { throw "build failed: $($target[0])" }
          }
          New-Item -ItemType Directory -Force preview-out/payload | Out-Null
          (git rev-parse HEAD).Trim() | Set-Content -Encoding ascii preview-out/payload/SOURCE_SHA.txt
          Copy-Item nexus.exe,nexus-desktop.exe,nexus-hud.exe,LICENSE preview-out/payload/
          foreach ($bin in @('nexus.exe','nexus-desktop.exe','nexus-hud.exe')) {
            if (-not (Test-Path "preview-out/payload/$bin")) { throw "missing $bin" }
            $metadata = (& go version -m "preview-out/payload/$bin") -join "`n"
            if ($LASTEXITCODE -ne 0 -or $metadata -notmatch 'go1\.26\.11') { throw "unexpected Go toolchain for $bin" }
          }
          Compress-Archive -Path preview-out/payload/* -DestinationPath preview-out/nexus-preview-windows-amd64.zip -Force
      - name: Produce V1 workspace acceptance record (windows-amd64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/workspace-acceptance-e2e.mjs run `
            --platform windows-amd64 `
            --sha "$env:GITHUB_SHA" `
            --job-url "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" `
            --log-dir "$env:RUNNER_TEMP/workspace-acceptance-logs" `
            --out "$env:RUNNER_TEMP/workspace-acceptance-windows-amd64.json" `
            --allow-incomplete
          if ($LASTEXITCODE -ne 0) { throw 'acceptance record failed' }
          if (-not (Test-Path "$env:RUNNER_TEMP/workspace-acceptance-windows-amd64.json")) { throw 'missing acceptance record' }
      - name: Upload V1 workspace acceptance record (windows-amd64)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-v1-workspace-acceptance-windows-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/workspace-acceptance-windows-amd64.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: preview-windows
          path: preview-out/*.zip
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }} unsigned preview
    runs-on: ${{ matrix.runner }}
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[unsigned-preview]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            machine: arm64
          - arch: intel
            runner: macos-15-intel
            machine: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Verify and build native apps
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          bun install --cwd web --frozen-lockfile
          bun run --cwd web quality:full
          go test -count=1 ./...
          make build
          version="$(tr -d '\r\n' < VERSION)"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          module='github.com/IAPro-Community/nexus'
          export NEXUS_UPDATE_PUBLIC_KEY="$(tr -d '\r\n[:space:]' < UPDATE_PUBLIC_KEY)"
          test "${#NEXUS_UPDATE_PUBLIC_KEY}" -eq 64
          export NEXUS_NATIVE_LDFLAGS="-s -w -X $module/internal/buildinfo.Version=$version -X $module/internal/buildinfo.Commit=$commit -X $module/internal/buildinfo.BuildDate=$build_date -X $module/internal/update.ProductionTrustRootHex=$NEXUS_UPDATE_PUBLIC_KEY"
          mkdir -p preview-out staging
          bash scripts/build-wails-v3-macos-app.sh ./cmd/nexus-desktop "staging/IAPro Nexus.app" nexus-desktop com.iapro.nexus.desktop "IAPro Nexus" "$version"
          bash scripts/build-wails-v3-macos-app.sh ./cmd/nexus-hud "staging/IAPro Nexus HUD.app" nexus-hud com.iapro.nexus.hud "Nexus HUD" "$version"
          mkdir -p preview-out/cli
          cp nexus LICENSE preview-out/cli/
          printf '%s\n' "$GITHUB_SHA" > preview-out/cli/SOURCE_SHA.txt
          test "$(go version -m preview-out/cli/nexus | grep -c 'go1.26.11')" -gt 0
          plutil -lint "staging/IAPro Nexus.app/Contents/Info.plist"
          plutil -lint "staging/IAPro Nexus HUD.app/Contents/Info.plist"
          test -x "staging/IAPro Nexus.app/Contents/MacOS/nexus-desktop"
          test -x "staging/IAPro Nexus HUD.app/Contents/MacOS/nexus-hud"
          tar -czf preview-out/nexus-preview-macos-${{ matrix.arch }}-cli.tar.gz -C preview-out/cli .
          rm -rf preview-out/cli
          ditto -c -k --sequesterRsrc --keepParent "staging/IAPro Nexus.app" preview-out/nexus-preview-macos-${{ matrix.arch }}-desktop.zip
          ditto -c -k --sequesterRsrc --keepParent "staging/IAPro Nexus HUD.app" preview-out/nexus-preview-macos-${{ matrix.arch }}-hud.zip
      - name: Produce V1 workspace acceptance record (macos-arm64)
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/workspace-acceptance-e2e.mjs run \
            --platform macos-arm64 \
            --sha "$GITHUB_SHA" \
            --job-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --log-dir "$RUNNER_TEMP/workspace-acceptance-logs" \
            --out "$RUNNER_TEMP/workspace-acceptance-macos-arm64.json" \
            --allow-incomplete
          test -s "$RUNNER_TEMP/workspace-acceptance-macos-arm64.json"
      - name: Upload V1 workspace acceptance record (macos-arm64)
        if: always() && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: nexus-v1-workspace-acceptance-macos-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/workspace-acceptance-macos-arm64.json
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: preview-macos-${{ matrix.arch }}
          path: preview-out/*
          if-no-files-found: error

  hosted-matrix-seal:
    name: Hosted cross-platform matrix seal
    needs: [linux, windows, macos]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: nexus-v1-workspace-acceptance-*
          path: acceptance
          merge-multiple: true
      - name: Seal hosted exact-SHA cross-platform proof
        shell: bash
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "${#TARGET_SHA}" -eq 40
          test -s acceptance/workspace-acceptance-linux-amd64.json
          test -s acceptance/workspace-acceptance-windows-amd64.json
          test -s acceptance/workspace-acceptance-macos-arm64.json
          node scripts/workspace-acceptance-e2e.mjs assemble \
            --sha "$TARGET_SHA" \
            --ci-run-id "$GITHUB_RUN_ID" \
            --linux-amd64 acceptance/workspace-acceptance-linux-amd64.json \
            --windows-amd64 acceptance/workspace-acceptance-windows-amd64.json \
            --macos-arm64 acceptance/workspace-acceptance-macos-arm64.json \
            --out hosted-cross-platform-proof.json
          test -s hosted-cross-platform-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-cross-platform-proof-${{ github.sha }}
          path: hosted-cross-platform-proof.json
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish clearly unsigned preview to source repository
    needs: [linux, windows, macos]
    if: (github.event_name != 'workflow_dispatch' || !inputs.acceptance_only) && !contains(github.event.head_commit.message, '[no-publish]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          path: preview-assets
          merge-multiple: true
      - name: Verify exact release source and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # Preview builds are immutable snapshots of their triggering SHA.
          # Parallel fixes may advance the branch; never relabel their content.
          for file in nexus-preview-linux-amd64.tar.gz nexus-preview-windows-amd64.zip nexus-preview-macos-arm64-cli.tar.gz nexus-preview-macos-arm64-desktop.zip nexus-preview-macos-arm64-hud.zip nexus-preview-macos-intel-cli.tar.gz nexus-preview-macos-intel-desktop.zip nexus-preview-macos-intel-hud.zip; do
            test -s "preview-assets/$file" || { echo "Missing $file" >&2; exit 1; }
          done
          (cd preview-assets && sha256sum nexus-preview-* > SHA256SUMS.txt)
      - name: Publish unsigned preview (not an updater channel)
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          tag_name: preview-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Nexus 1.0 - Unsigned Preview (${{ github.sha }})
          prerelease: true
          make_latest: false
          files: preview-assets/*
          fail_on_unmatched_files: true
          body: |
            UNSIGNED DEVELOPMENT PREVIEW - NOT A CERTIFIED RELEASE.
            Source SHA: ${{ github.sha }}
            Source: https://github.com/IAPro-Community/nexus/tree/release/v1.0.0

            Linux amd64, Windows amd64, macOS arm64 and macOS Intel builds were compiled by GitHub-hosted runners.
            No Microsoft Authenticode certificate, Apple Developer ID, notarization or signed update manifest.
            Windows SmartScreen and macOS Gatekeeper may warn or block launch.
            Immutable snapshot, manual installation/testing only. Signed updater channels never reference preview tags.
            See SHA256SUMS.txt and the workflow logs. Do not advertise this as stable.
