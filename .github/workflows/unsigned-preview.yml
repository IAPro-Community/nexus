name: Unsigned Source Release Preview

# Manual opt-in only. This is NOT the signed production release or updater channel.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-unsigned-preview
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  linux:
    name: Linux amd64 unsigned preview
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install native Wails build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev pkg-config
      - name: Verify and build
        shell: bash
        run: |
          set -euo pipefail
          bun install --cwd web --frozen-lockfile
          bun run --cwd web quality:full
          go test -count=1 ./...
          make build
          make build-desktop-wails
          make build-hud-wails
          mkdir -p preview-out/payload
          cp nexus cmd/nexus-desktop/build/bin/nexus-desktop cmd/nexus-hud/build/bin/nexus-hud preview-out/payload/
          tar -czf preview-out/nexus-preview-linux-amd64.tar.gz -C preview-out/payload .
          rm -rf preview-out/payload
      - uses: actions/upload-artifact@v4
        with:
          name: preview-linux
          path: preview-out/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows amd64 unsigned preview
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Verify and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          bun install --cwd web --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'bun install failed' }
          bun run --cwd web quality:full
          if ($LASTEXITCODE -ne 0) { throw 'frontend quality failed' }
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { throw 'Go tests failed' }
          $version = (Get-Content VERSION -Raw).Trim()
          $commit = (git rev-parse --short HEAD).Trim()
          $date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $module = 'github.com/IAPro-Community/nexus'
          $ld = "-s -w -X $module/internal/buildinfo.Version=$version -X $module/internal/buildinfo.Commit=$commit -X $module/internal/buildinfo.BuildDate=$date"
          foreach ($target in @(@('nexus','./cmd/nexus'),@('nexus-desktop','./cmd/nexus-desktop'),@('nexus-hud','./cmd/nexus-hud'))) {
            go build -trimpath -buildvcs=false -tags production -ldflags $ld -o "$($target[0]).exe" $target[1]
            if ($LASTEXITCODE -ne 0) { throw "build failed: $($target[0])" }
          }
          New-Item -ItemType Directory -Force preview-out | Out-Null
          Compress-Archive -Path nexus.exe,nexus-desktop.exe,nexus-hud.exe -DestinationPath preview-out/nexus-preview-windows-amd64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: preview-windows
          path: preview-out/*.zip
          if-no-files-found: error

  macos:
    name: macOS arm64 unsigned preview
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Verify and build native apps
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          bun install --cwd web --frozen-lockfile
          bun run --cwd web quality:full
          go test -count=1 ./...
          make build
          version="$(tr -d '\r\n' < VERSION)"
          commit="$(git rev-parse --short HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          module='github.com/IAPro-Community/nexus'
          export NEXUS_NATIVE_LDFLAGS="-s -w -X $module/internal/buildinfo.Version=$version -X $module/internal/buildinfo.Commit=$commit -X $module/internal/buildinfo.BuildDate=$build_date"
          mkdir -p preview-out staging
          bash scripts/build-wails-v3-macos-app.sh ./cmd/nexus-desktop "staging/IAPro Nexus.app" nexus-desktop com.iapro.nexus.desktop "IAPro Nexus" "$version"
          bash scripts/build-wails-v3-macos-app.sh ./cmd/nexus-hud "staging/IAPro Nexus HUD.app" nexus-hud com.iapro.nexus.hud "Nexus HUD" "$version"
          tar -czf preview-out/nexus-preview-macos-arm64-cli.tar.gz nexus
          ditto -c -k --sequesterRsrc --keepParent "staging/IAPro Nexus.app" preview-out/nexus-preview-macos-arm64-desktop.zip
          ditto -c -k --sequesterRsrc --keepParent "staging/IAPro Nexus HUD.app" preview-out/nexus-preview-macos-arm64-hud.zip
      - uses: actions/upload-artifact@v4
        with:
          name: preview-macos
          path: preview-out/*
          if-no-files-found: error

  publish:
    name: Publish clearly unsigned preview to source repository
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          path: preview-assets
          merge-multiple: true
      - name: Verify exact release source and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/release/v1.0.0" --jq '.object.sha')"
          test "$current" = "$GITHUB_SHA" || { echo 'Release HEAD changed; rerun preview against new SHA' >&2; exit 1; }
          for file in nexus-preview-linux-amd64.tar.gz nexus-preview-windows-amd64.zip nexus-preview-macos-arm64-cli.tar.gz nexus-preview-macos-arm64-desktop.zip nexus-preview-macos-arm64-hud.zip; do
            test -s "preview-assets/$file" || { echo "Missing $file" >&2; exit 1; }
          done
          (cd preview-assets && sha256sum nexus-preview-* > SHA256SUMS.txt)
      - name: Move preview-only rolling pointer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/channel-preview" --jq '.object.sha' 2>/dev/null || true)"
          if [ -z "$current" ]; then
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref='refs/tags/channel-preview' -f sha="$GITHUB_SHA" >/dev/null
          elif [ "$current" != "$GITHUB_SHA" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/channel-preview" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          fi
      - name: Publish unsigned preview (not an updater channel)
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          token: ${{ github.token }}
          tag_name: channel-preview
          name: Nexus 1.0 - Unsigned Development Preview
          prerelease: true
          make_latest: false
          files: preview-assets/*
          fail_on_unmatched_files: true
          body: |
            UNSIGNED DEVELOPMENT PREVIEW - NOT A CERTIFIED RELEASE.
            Source SHA: ${{ github.sha }}
            Source: https://github.com/IAPro-Community/nexus/tree/release/v1.0.0

            Linux amd64, Windows amd64 and macOS arm64 builds were compiled by GitHub-hosted runners.
            No Microsoft Authenticode certificate, Apple Developer ID, notarization or signed update manifest.
            Windows SmartScreen and macOS Gatekeeper may warn or block launch.
            Manual installation/testing only. The signed updater does NOT use channel-preview.
            See SHA256SUMS.txt and the workflow logs. Do not advertise this as stable.
