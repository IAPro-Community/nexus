name: Temporary fenced attention verification
on:
  push:
    branches: [feat/attention-fenced-response-20261028]
    paths:
      - .github/workflows/temporary-attention-fence-verification-20261028.yml
permissions:
  contents: write
jobs:
  validate:
    if: github.ref == 'refs/heads/feat/attention-fenced-response-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Format only reviewed Go files
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/control/registry/models.go internal/control/registry/registry.go internal/control/registry/attention_claim.go internal/control/registry/attention_claim_test.go internal/control/host/attention.go internal/nexus/runtime_application.go internal/control/web/handlers_api.go internal/control/web/handlers_attention_fence_test.go
      - name: Install and format reviewed Web files
        shell: bash
        run: |
          set -euo pipefail
          bun install --cwd web --frozen-lockfile
          cd web
          bunx prettier --write src/types.ts src/api.ts src/components/attentionResponseGuard.ts src/components/AttentionNotificationCard.tsx src/components/attentionToastModel.ts src/components/AttentionNotification.test.ts src/components/attentionToastModel.test.ts
          bunx eslint src/types.ts src/api.ts src/components/attentionResponseGuard.ts src/components/AttentionNotificationCard.tsx src/components/attentionToastModel.ts src/components/AttentionNotification.test.ts src/components/attentionToastModel.test.ts
          bun run typecheck
          bunx vitest run src/components/AttentionNotification.test.ts src/components/attentionToastModel.test.ts src/app/documentTitle.test.ts src/app/attentionRadarModel.test.ts
      - name: Go registry, application, HTTP and host tests
        run: |
          go test -count=1 ./internal/control/registry ./internal/nexus ./internal/control/web ./internal/control/host
      - name: Check patch and commit formatting to this branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- internal/control/registry/models.go internal/control/registry/registry.go internal/control/registry/attention_claim.go internal/control/registry/attention_claim_test.go internal/control/host/attention.go internal/nexus/runtime_application.go internal/control/web/handlers_api.go internal/control/web/handlers_attention_fence_test.go web/src/types.ts web/src/api.ts web/src/components/attentionResponseGuard.ts web/src/components/AttentionNotificationCard.tsx web/src/components/attentionToastModel.ts web/src/components/AttentionNotification.test.ts web/src/components/attentionToastModel.test.ts
          if git diff --cached --quiet; then
            echo 'All changes already match gofmt and Prettier'
            exit 0
          fi
          git fetch origin feat/attention-fenced-response-20261028
          test "$(git rev-parse origin/feat/attention-fenced-response-20261028)" = "$(git rev-parse HEAD)" || {
            echo 'Branch moved during tests; refusing stale write'
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(attention): format fenced response implementation'
          git push origin HEAD:refs/heads/feat/attention-fenced-response-20261028
