name: Temporary Herdr formatting diff
on:
  pull_request:
    branches: ['release/v1.0.0']
permissions:
  contents: read
jobs:
  check-format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install locked frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Produce formatter patch without pushing
        working-directory: web
        run: |
          bunx prettier --write src/features/agents/directorFleetModel.test.ts
          echo '### PRETTIER_PATCH_START ###'
          git diff --unified=3 -- src/features/agents/directorFleetModel.test.ts
          echo '### PRETTIER_PATCH_END ###'
