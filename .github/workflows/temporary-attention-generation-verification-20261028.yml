name: Temporary Attention generation fencing verification
on:
  push:
    branches: [fix/attention-late-event-fencing-20261028]
    paths:
      - .github/workflows/temporary-attention-generation-verification-20261028.yml
permissions:
  contents: write
jobs:
  attention-generation:
    name: Attention generation Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Format only changed Go sources
        shell: bash
        run: |
          gofmt -w internal/control/registry/registry.go internal/control/registry/attention_generation_test.go internal/control/host/attention.go internal/control/host/host.go
      - name: Check gofmt, fail before code execution if unformatted
        shell: bash
        run: |
          set -euo pipefail
          files=(internal/control/registry/registry.go internal/control/registry/attention_generation_test.go internal/control/host/attention.go internal/control/host/host.go)
          bad="$(gofmt -l "${files[@]}")"
          if [[ -n "$bad" ]]; then
            printf 'Unformatted files:\n%s\n' "$bad"
            exit 1
          fi
          git diff --check
      - name: Test attention revision, generation and existing host lifecycle
        run: |
          go test -count=1 ./internal/control/registry ./internal/control/host ./internal/control/web
      - name: Race-test session fencing and host attention
        run: |
          go test -race -count=1 -timeout 5m ./internal/control/registry ./internal/control/host
      - name: Commit formatter output to isolated repair branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -- internal/control/registry/registry.go internal/control/registry/attention_generation_test.go internal/control/host/attention.go internal/control/host/host.go
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin fix/attention-late-event-fencing-20261028
          test "$(git rev-parse origin/fix/attention-late-event-fencing-20261028)" = "$(git rev-parse HEAD)" || exit 1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(attention): apply Go formatter to generation fencing'
          git push origin HEAD:refs/heads/fix/attention-late-event-fencing-20261028
