name: Temporary Attention generation fencing verification
on:
  push:
    branches: [fix/attention-late-event-fencing-20261028]
    paths:
      - .github/workflows/temporary-attention-generation-verification-20261028.yml
permissions:
  contents: read
jobs:
  attention-generation:
    name: Attention generation Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Check gofmt, fail before code execution if unformatted
        shell: bash
        run: |
          set -euo pipefail
          files=(internal/control/registry/registry.go internal/control/registry/attention_generation_test.go internal/control/host/attention.go internal/control/host/host.go)
          bad="$(gofmt -l "${files[@]}")"
          if [[ -n "$bad" ]]; then
            printf 'Unformatted files:\n%s\n' "$bad"
            exit 1
          fi
          git diff --check
      - name: Test attention revision, generation and existing host lifecycle
        run: |
          go test -count=1 ./internal/control/registry ./internal/control/host ./internal/control/web
      - name: Race-test session fencing and host attention
        run: |
          go test -race -count=1 -timeout 5m ./internal/control/registry ./internal/control/host
