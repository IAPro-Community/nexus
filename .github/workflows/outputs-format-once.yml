name: Format Outputs Implementation (one shot)
on:
  push:
    branches: [release/v1.0.0]
    paths: ['.github/workflows/outputs-format-once.yml']
permissions:
  contents: write
jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Format Go source
        run: gofmt -w internal/nexus/artifacts internal/control/web/handlers_project_outputs.go internal/control/web/routes_projects_agents.go
      - name: Format TypeScript and SCSS
        run: |
          cd web
          bun install --frozen-lockfile
          ./node_modules/.bin/prettier --write src/features/outputs/OutputsSurface.tsx src/features/outputs/OutputsSurface.module.scss src/app/surfaces.ts src/app/routes.ts src/app/WorkspaceSurfaceHost.tsx src/app/NexusWorkspaceApp.tsx src/features/projects/ProjectRail.tsx
      - name: Commit and delete one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/outputs-format-once.yml
          git add internal/nexus/artifacts internal/control/web/handlers_project_outputs.go internal/control/web/routes_projects_agents.go web/src/features/outputs web/src/app/surfaces.ts web/src/app/routes.ts web/src/app/WorkspaceSurfaceHost.tsx web/src/app/NexusWorkspaceApp.tsx web/src/features/projects/ProjectRail.tsx
          git commit -m 'style(outputs): format gallery and artifact service'
          git push origin HEAD:release/v1.0.0
