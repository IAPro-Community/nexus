name: Format Outputs Provenance (one shot)
on:
  push:
    branches: [release/v1.0.0]
    paths: ['.github/workflows/outputs-provenance-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.0
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: gofmt -w internal/nexus/artifacts/catalog.go internal/nexus/artifacts/history.go internal/nexus/artifacts/history_test.go internal/control/web/handlers_project_outputs.go internal/control/web/handlers_output_publish_mcp.go internal/control/web/handlers_browser_mcp.go
      - run: |
          cd web
          bun install --frozen-lockfile
          ./node_modules/.bin/prettier --write src/features/outputs/OutputsSurface.tsx src/features/outputs/OutputsSurface.module.scss
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/outputs-provenance-format-once.yml
          git add internal/nexus/artifacts internal/control/web/handlers_project_outputs.go internal/control/web/handlers_output_publish_mcp.go internal/control/web/handlers_browser_mcp.go web/src/features/outputs
          git commit -m 'style(outputs): format revision tracking and provenance publishing'
          git push origin HEAD:release/v1.0.0
