name: Refresh synthetic documentation captures

on:
  push:
    branches:
      - release/v1.0.0
    paths:
      - .github/workflows/visual-refresh.yml
      - web/src/**
      - internal/desktop/hud_appearance.go
      - cmd/nexus-desktop/**
      - web/scripts/docs-capture.mjs
      - scripts/nex-reference-path.mjs
      - scripts/verify-nex-image-references.mjs
      - scripts/tests/nex-reference-path.test.mjs
      - docs/design/nex/reference-pack/2026-10-28/manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexus-v1-synthetic-visual-refresh
  cancel-in-progress: true

jobs:
  capture-and-publish:
    # Never run unreviewed PR code with a write token.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/release/v1.0.0'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          # Capture the precise SHA that triggered this run; reject branch drift.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Install locked Web dependencies and Chromium
        shell: pwsh
        run: |
          bun install --cwd web --frozen-lockfile
          bun run --cwd web playwright install chromium

      - name: Verify NEX reference paths on Windows and Linux
        shell: pwsh
        run: node --test scripts/tests/nex-reference-path.test.mjs

      - name: Validate public documentation before capture
        shell: pwsh
        run: node scripts/docs-verify.mjs --links-only

      - name: Capture isolated synthetic application surfaces
        shell: pwsh
        run: bun run --cwd web docs:capture

      - name: Verify source-SHA and documentation evidence
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $m = Get-Content docs/assets/screenshots/manifest.json -Raw | ConvertFrom-Json
          if ($m.source_sha -ne $sha) { throw "Source SHA mismatch in screenshot manifest" }
          $web = @($m.captures | Where-Object { $_.id -ne 'VIS-011' })
          if ($web.Count -ne 10) { throw "Expected exactly 10 Web screenshots" }
          foreach ($item in $web) {
            if ($item.source_sha -ne $sha -or $item.status -ne 'PASS' -or $item.data_classification -ne 'SYNTHETIC') {
              throw "Capture not verified: $($item.id)"
            }
          }
          $native = @($m.captures | Where-Object { $_.id -eq 'VIS-011' })
          if ($native.Count -ne 1) { throw "Expected historical native Desktop reference" }
          if ($native[0].source_sha -ne $sha -and $native[0].status -ne 'HISTORICAL') {
            throw "Unverified native Desktop cannot claim PASS"
          }
          node scripts/docs-verify.mjs

      - name: Commit synthetic screenshots only if branch has not moved
        shell: pwsh
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          $source = (git rev-parse HEAD).Trim()
          git fetch origin release/v1.0.0
          $remote = (git rev-parse origin/release/v1.0.0).Trim()
          if ($remote -ne $source) { throw "Source branch advanced during capture: refusing stale write" }
          git add -- docs/assets/screenshots/*.png docs/assets/screenshots/manifest.json docs/assets/demos/direct-workflow.webm
          $staged = @(git diff --cached --name-only)
          foreach ($file in $staged) {
            if ($file -notmatch '^docs/assets/screenshots/(?:[a-z0-9-]+\.png|manifest\.json)$' -and $file -ne 'docs/assets/demos/direct-workflow.webm') {
              throw "Unexpected staged file"
            }
          }
          if ($staged.Count -eq 0) { Write-Output "No changes to publish"; exit 0 }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(visual): recapture synthetic Web evidence for source $($source.Substring(0,12))"
          git push origin HEAD:release/v1.0.0

