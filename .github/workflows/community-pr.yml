name: Community PR Checks

# Fork code may be untrusted. Never use pull_request_target, deployment
# credentials, release signing environments or self-hosted runners here.
on:
  pull_request:
    branches: [main, master, 'release/v1.0.0']

permissions:
  contents: read

concurrency:
  group: community-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  community-quality:
    name: Community source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      CI: "true"
    steps:
      - name: Check out pull request (no persistent credentials)
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Go matching the release CI toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install frontend dependencies without lock changes
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Check docs and internal links
        run: node scripts/docs-verify.mjs
      - name: Frontend quality and build
        working-directory: web
        run: bun run quality:full
      - name: Go tests (including license consistency checks)
        # Native GTK/WebKit and packaging validation stay in protected push CI.
        run: go test -count=1 ./internal/...

  community-static-safety:
    name: Community diff hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out pull request (no credentials)
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check diff whitespace and conflict markers
        run: |
          git diff --check HEAD^ HEAD
          if git diff --unified=0 HEAD^ HEAD | grep -E '^\+(<<<<<<< |>>>>>>> )'; then
            echo "Unresolved merge/conflict marker in source" >&2
            exit 1
          fi
