name: Community PR Checks

# Fork code may be untrusted. Never use pull_request_target, deployment
# credentials, release signing environments or self-hosted runners here.
on:
  pull_request:
    branches: [main, master, 'release/v1.0.0']

permissions:
  contents: read

concurrency:
  group: community-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  community-quality:
    name: Community source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      CI: "true"
    steps:
      - name: Check out pull request (no persistent credentials)
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect PR change scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          source_changed=false
          while IFS= read -r changed_path; do
            case "$changed_path" in
              docs/*.md|README.md|README.en.md|README.es.md|ROADMAP.md|.github/workflows/community-pr.yml) ;;
              *) source_changed=true ;;
            esac
          done < <(git diff --name-only HEAD^1 HEAD)
          echo "source_changed=$source_changed" >> "$GITHUB_OUTPUT"
          echo "PR source/assets changed: $source_changed"
      - name: Install Go matching the release CI toolchain
        if: steps.scope.outputs.source_changed == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Install Bun
        if: steps.scope.outputs.source_changed == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install frontend dependencies without lock changes
        if: steps.scope.outputs.source_changed == 'true'
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Diagnostic Prettier diff for workspace files (temporary)
        if: steps.scope.outputs.source_changed == 'true'
        working-directory: web
        shell: bash
        run: |
          for file in src/workspace/arrangePresets.ts src/workspace/arrangePresets.test.ts; do
            bunx prettier "$file" > "${RUNNER_TEMP}/$(basename "$file").expected"
            diff -u "$file" "${RUNNER_TEMP}/$(basename "$file").expected" || true
          done
      - name: Check docs and internal links
        # Documentation-only PRs receive full link/contract checks, not a
        # false visual certificate for a pre-existing source snapshot.
        env:
          PR_SOURCE_CHANGED: ${{ steps.scope.outputs.source_changed }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PR_SOURCE_CHANGED" == "true" ]]; then
            node scripts/docs-verify.mjs
          else
            node scripts/docs-verify.mjs --links-only
            node scripts/verify-feature-catalog.mjs
            node scripts/verify-release-docs.mjs
            node scripts/verify-nex-visual.mjs
          fi
      - name: Frontend quality and build
        if: steps.scope.outputs.source_changed == 'true'
        working-directory: web
        run: bun run quality:full
      - name: Install Wails v3 GTK4/WebKitGTK dependencies for Go tests
        if: steps.scope.outputs.source_changed == 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Go tests (including license consistency checks)
        if: steps.scope.outputs.source_changed == 'true'
        # Host-side Go build/test coverage; GUI interaction and signed
        # packaging still require the separate protected native gates.
        run: go test -count=1 ./internal/...

  community-static-safety:
    name: Community diff hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out pull request (no credentials)
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check diff whitespace and conflict markers
        run: |
          git diff --check HEAD^ HEAD
          if git diff --unified=0 HEAD^ HEAD | grep -E '^\+(<<<<<<< |>>>>>>> )'; then
            echo "Unresolved merge/conflict marker in source" >&2
            exit 1
          fi
