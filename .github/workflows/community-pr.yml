name: Community PR Checks

# Untrusted fork contributions run only on ephemeral GitHub-hosted workers.
# No pull_request_target, self-hosted labels, environment secrets or signers.
on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: community-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  community-quality:
    name: Community source quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      CI: "true"
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install JavaScript dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Check documentation and links
        run: node scripts/docs-verify.mjs
      - name: Frontend tests and build
        working-directory: web
        run: bun run quality:full
      - name: Go unit and integration tests
        run: go test -count=1 ./internal/...

  community-static-safety:
    name: Community diff hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check whitespace and unresolved merge conflicts
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD
          if git diff --unified=0 HEAD^ HEAD | grep -E '^\+(<<<<<<< |>>>>>>> )'; then
            echo "Unresolved conflict marker in source" >&2
            exit 1
          fi
