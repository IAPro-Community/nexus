name: Temporary AgentWire gofmt repair
on:
  push:
    branches: [fix/agentwire-gofmt-parity-20261028]
    paths:
      - .github/workflows/temporary-agentwire-gofmt-20261028.yml
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/agentwire-gofmt-parity-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Format exactly the ten files reported by AgentWire release gate
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            internal/control/agentwire/projection.go \
            internal/control/agentwire/projection_test.go \
            internal/control/driver/structured_command.go \
            internal/control/host/attention.go \
            internal/control/host/host.go \
            internal/control/host/structured_backend.go \
            internal/control/host/structured_input_test.go \
            internal/control/host/structured_reducer_integration_test.go \
            internal/control/web/handlers_api.go \
            internal/control/web/structured_multiclient_process_e2e_test.go
          git diff --check
      - name: Test changed Go control-plane packages
        run: go test -count=1 ./internal/control/agentwire ./internal/control/driver ./internal/control/host ./internal/control/web
      - name: Commit formatting to this repair branch only
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            internal/control/agentwire/projection.go \
            internal/control/agentwire/projection_test.go \
            internal/control/driver/structured_command.go \
            internal/control/host/attention.go \
            internal/control/host/host.go \
            internal/control/host/structured_backend.go \
            internal/control/host/structured_input_test.go \
            internal/control/host/structured_reducer_integration_test.go \
            internal/control/web/handlers_api.go \
            internal/control/web/structured_multiclient_process_e2e_test.go
          if git diff --cached --quiet; then
            echo 'All ten Go files already formatted'
            exit 0
          fi
          git fetch origin fix/agentwire-gofmt-parity-20261028
          test "$(git rev-parse origin/fix/agentwire-gofmt-parity-20261028)" = "$(git rev-parse HEAD)" || {
            echo 'Branch moved; refusing stale write'
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(agentwire): apply gofmt to shared structured runtime'
          git push origin HEAD:refs/heads/fix/agentwire-gofmt-parity-20261028
