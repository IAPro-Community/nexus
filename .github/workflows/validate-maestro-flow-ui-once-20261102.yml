name: One-shot Maestro Flow UI quality and synthetic capture
on:
  push:
    branches: [feat/flow-maestro-routing-panel-20261102]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'IAPro-Community/nexus'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install frozen frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Format changed UI files with project Prettier
        working-directory: web
        run: |
          bunx prettier --write src/types.ts src/nexus/api.ts src/features/work/MaestroRoutingPreview.tsx src/features/work/MaestroRoutingPreview.module.scss src/features/work/FlowDraftEditor.tsx
      - name: Check type, lint, styles and build
        working-directory: web
        run: |
          bun run typecheck
          bun run lint
          bun run lint:styles
          bun run build
      - name: Commit Prettier changes BEFORE certified source capture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- web/src/types.ts web/src/nexus/api.ts web/src/features/work/MaestroRoutingPreview.tsx web/src/features/work/MaestroRoutingPreview.module.scss web/src/features/work/FlowDraftEditor.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style(flow): format Maestro multiagent preflight source"
          fi
      - name: Install Playwright Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Recapture official synthetic visual evidence
        working-directory: web
        run: bun run docs:capture
      - name: Verify docs and capture manifest
        run: node scripts/docs-verify.mjs
      - name: Remove helper, commit verified visual source and provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/validate-maestro-flow-ui-once-20261102.yml
          git add -- web/src/types.ts web/src/nexus/api.ts web/src/features/work/MaestroRoutingPreview.tsx web/src/features/work/MaestroRoutingPreview.module.scss web/src/features/work/FlowDraftEditor.tsx
          git add -A -- docs/assets/screenshots/ docs/assets/demos/
          git diff --cached --name-only
          git commit -m "feat(flow): validate multiagent routing UI and refresh synthetic evidence"
          git push origin "HEAD:feat/flow-maestro-routing-panel-20261102"
