name: Browser source formatter (one shot)
on:
  push:
    branches: [release/v1.0.0]
    paths: ['.github/workflows/browser-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.0
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - run: cd web && bun install --frozen-lockfile
      - name: Apply gofmt and Prettier
        run: |
          gofmt -w internal/browsercontrol/browser.go internal/browsercontrol/browser_stream.go internal/browsercontrol/browser_test.go internal/control/web/handlers_browser.go
          cd web
          ./node_modules/.bin/prettier --write src/features/browser/BrowserSurface.tsx src/features/browser/BrowserSurface.module.scss
      - name: Commit formatting and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/browser-format-once.yml
          git add internal/browsercontrol internal/control/web/handlers_browser.go web/src/features/browser
          git commit -m 'style(browser): format streaming, controls and tests'
          git push origin HEAD:release/v1.0.0
