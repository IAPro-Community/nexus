name: Temporary Windows FeatureTour casing verification
on:
  pull_request:
    branches:
      - release/v1.0.0
    paths:
      - web/src/features/work/**
      - .github/workflows/temporary-windows-tour-casing-20261028.yml
permissions:
  contents: read
jobs:
  windows-tour-typecheck:
    if: github.event.pull_request.head.ref == 'fix/windows-featuretour-casing-v1-20261028'
    name: Windows FeatureTour TypeScript
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install locked dependencies
        shell: pwsh
        run: bun install --cwd web --frozen-lockfile
      - name: Verify TypeScript in case-insensitive filesystem
        shell: pwsh
        run: bun run --cwd web typecheck
