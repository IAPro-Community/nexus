name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      native_target_sha:
        description: Full commit SHA to certify natively (leave empty for regular CI)
        required: false
        default: ''
        type: string
      native_platform:
        description: Native platform certification scope
        required: false
        default: all
        type: choice
        options:
          - windows
          - macos
          - all

# Untrusted fork PRs run only in isolated community-pr.yml on GitHub-hosted
# runners. Self-hosted CI jobs remain push/dispatch-only; require protected
# branches and approval of users permitted to push.
permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  NEXUS_UPDATE_PUBLIC_KEY: ${{ vars.NEXUS_UPDATE_PUBLIC_KEY }}

jobs:
  workspace-sanitize:
    name: Sanitize self-hosted workspace
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - name: Remove stale root-owned build output
        shell: bash
        run: |
          set -euo pipefail
          for path in dist native-artifacts native-staging packaging/windows/payload; do
            target="$GITHUB_WORKSPACE/$path"
            [ -e "$target" ] || continue
            if rm -rf "$target" 2>/dev/null; then
              continue
            fi
            sudo -n rm -rf "$target"
          done

  frontend:
    needs: workspace-sanitize
    name: Frontend (Format, Lint, Styles, Typecheck, Unit & Build)
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Verify documentation
        run: bun scripts/docs-verify.mjs
      - working-directory: web
        run: bun install --frozen-lockfile
      - name: Verify frontend formatting
        working-directory: web
        run: |
          set -euo pipefail
          if bun run format:check; then
            exit 0
          fi
          mapfile -t files < <(bunx prettier --list-different 'src/**/*.{ts,tsx,css,json}')
          for file in "${files[@]}"; do
            [ -n "$file" ] || continue
            formatted="$RUNNER_TEMP/prettier-${file//\//_}"
            bunx prettier "$file" > "$formatted"
            echo "::group::prettier diff $file"
            diff -u "$file" "$formatted" || true
            echo "::endgroup::"
          done
          exit 1
      - working-directory: web
        run: bun run typecheck
      - working-directory: web
        run: bun run lint
      - working-directory: web
        run: bun run lint:styles
      - working-directory: web
        run: bun run check:styles
      - working-directory: web
        run: bun run test
      - working-directory: web
        run: bun run build
      - working-directory: web
        run: bun run verify

  release-config:
    needs: workspace-sanitize
    name: Release configuration
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - uses: actions/checkout@v5
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: check

  security:
    needs: workspace-sanitize
    name: Security
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - run: GOTOOLCHAIN=local go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  browser:
    name: Browser E2E, Axe & visual smoke
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: bun install --frozen-lockfile
      - name: Build exact-SHA frontend for embedded browser runtime
        working-directory: web
        run: bun run build
      - name: Install Chromium browser only
        working-directory: web
        run: bunx playwright install chromium
      - run: go build -trimpath -o nexus ./cmd/nexus
      - id: browser-e2e
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e 2>&1 | tee "$RUNNER_TEMP/nexus-browser-e2e.log"
      - id: surface-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:surface 2>&1 | tee "$RUNNER_TEMP/nexus-browser-surface.log"
      - id: capacity-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:capacity 2>&1 | tee "$RUNNER_TEMP/nexus-browser-capacity.log"
      - id: hud-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:hud 2>&1 | tee "$RUNNER_TEMP/nexus-browser-hud.log"
      - id: composer-spine-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:composer-spine 2>&1 | tee "$RUNNER_TEMP/nexus-browser-composer-spine.log"
      - id: composer-vague-spine-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:composer-vague-spine 2>&1 | tee "$RUNNER_TEMP/nexus-browser-composer-vague-spine.log"
      - id: composer-theme-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:composer-themes 2>&1 | tee "$RUNNER_TEMP/nexus-browser-composer-themes.log"
      - id: browser-a11y
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:a11y 2>&1 | tee "$RUNNER_TEMP/nexus-browser-a11y.log"
      - id: browser-visual
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:visual 2>&1 | tee "$RUNNER_TEMP/nexus-browser-visual.log"
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nexus-browser-*.log
            .tempmediaStorage/e2e-failure-diagnostics.json
            .tempmediaStorage/e2e-failure.png
            .tempmediaStorage/e2e-surface-failure-diagnostics.json
            .tempmediaStorage/e2e-surface-failure.png
            .tempmediaStorage/hud/
            .tempmediaStorage/composer-themes/
            DEV/validation/composer-execution-spine/
          if-no-files-found: ignore
          retention-days: 2
      - name: Upload Nexus HUD Web evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-web-evidence-${{ github.sha }}
          path: |
            .tempmediaStorage/hud/
            ${{ runner.temp }}/nexus-browser-hud.log
          if-no-files-found: error
          retention-days: 14
      - if: always()
        run: |
          test '${{ steps.browser-e2e.outcome }}' = success
          test '${{ steps.surface-e2e.outcome }}' = success
          test '${{ steps.capacity-e2e.outcome }}' = success
          test '${{ steps.hud-e2e.outcome }}' = success
          test '${{ steps.composer-spine-e2e.outcome }}' = success
          test '${{ steps.composer-vague-spine-e2e.outcome }}' = success
          test '${{ steps.composer-theme-e2e.outcome }}' = success
          test '${{ steps.browser-a11y.outcome }}' = success
          test '${{ steps.browser-visual.outcome }}' = success

  test-linux:
    needs: workspace-sanitize
    name: Linux E2E (Go 1.25.14)
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - name: Wails v2 + tray linker compatibility probe
        shell: bash
      - name: Verify gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l . | grep -v '^./\.worktrees/' || true)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"
            printf '%s\n' "$unformatted"
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              echo "::group::gofmt diff $file"
              gofmt -d "$file"
              echo "::endgroup::"
            done <<< "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m
      - run: go test -v -race ./...
      - run: go test -race -v -count=1 ./internal/control/terminal/... ./internal/control/protocol/...
      - run: go test -race -v -count=1 ./internal/control/host/... ./internal/control/web/...
      - run: go build -trimpath -v ./cmd/nexus
      - name: Unix installer/uninstaller lifecycle smoke
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n uninstall.sh
          root="$(mktemp -d)"
          home="$root/home"
          prefix="$root/prefix"
          mkdir -p "$home/.local/share/applications" "$home/Desktop" "$home/.local/share/nexus" "$prefix/bin"
          touch "$prefix/bin/nexus" "$prefix/bin/nexus-desktop" "$prefix/bin/maestro" "$prefix/bin/orquestrador"
          touch "$home/.local/share/applications/iapro-nexus.desktop" "$home/Desktop/IAPro Nexus.desktop"
          printf '# existing\n# IAPro Nexus\nexport PATH="$HOME/.local/bin:$PATH"\n' > "$home/.bashrc"
          HOME="$home" PREFIX="$prefix" bash ./uninstall.sh
          HOME="$home" PREFIX="$prefix" bash ./uninstall.sh
          test ! -e "$prefix/bin/nexus"
          test ! -e "$prefix/bin/nexus-desktop"
          test ! -e "$home/.local/share/applications/iapro-nexus.desktop"
          test ! -e "$home/Desktop/IAPro Nexus.desktop"
          test -d "$home/.local/share/nexus"
          ! grep -Fq '# IAPro Nexus' "$home/.bashrc"
          grep -Fq '# existing' "$home/.bashrc"

  desktop-linux:
    name: Desktop Linux (Wails native build)
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Verify Wails system dependencies
        run: |
          pkg-config --exists gtk+-3.0
          pkg-config --exists webkit2gtk-4.1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: bun install --frozen-lockfile
      - name: Build Linux desktop
        run: |
          set -euo pipefail
          test -n "${NEXUS_UPDATE_PUBLIC_KEY}" || {
            echo "NEXUS_UPDATE_PUBLIC_KEY is required for desktop CI" >&2
            exit 1
          }
          make build-desktop-wails
          test -f cmd/nexus-desktop/build/bin/nexus-desktop
          make build-hud-wails
          test -f cmd/nexus-hud/build/bin/nexus-hud
      - name: Native HUD launch smoke and resource sample
        env:
          NEXUS_ENABLE_HUD: "1"
          NEXUS_DATA_DIR: ${{ runner.temp }}/nexus-hud-smoke-data
          XDG_SESSION_TYPE: x11
        run: |
          set -euo pipefail
          command -v xvfb-run >/dev/null
          command -v dbus-run-session >/dev/null
          metrics="$RUNNER_TEMP/nexus-hud-linux-metrics.txt"
          log="$RUNNER_TEMP/nexus-hud-linux-smoke.log"
          binary="$PWD/cmd/nexus-hud/build/bin/nexus-hud"
          dbus-run-session -- xvfb-run -a "$binary" >"$log" 2>&1 &
          launcher=$!
          cleanup() {
            hud_pid="$(pgrep -x nexus-hud | head -n1 || true)"
            if [ -n "$hud_pid" ]; then kill -TERM "$hud_pid" 2>/dev/null || true; fi
            kill -TERM "$launcher" 2>/dev/null || true
            wait "$launcher" 2>/dev/null || true
          }
          trap cleanup EXIT

          hud_pid=""
          for attempt in $(seq 1 30); do
            hud_pid="$(pgrep -x nexus-hud | head -n1 || true)"
            if [ -n "$hud_pid" ] && kill -0 "$hud_pid" 2>/dev/null; then break; fi
            if ! kill -0 "$launcher" 2>/dev/null; then
              cat "$log"
              echo "Nexus HUD exited before native smoke became ready" >&2
              exit 1
            fi
            sleep 1
          done
          test -n "$hud_pid"
          kill -0 "$hud_pid"

          collect_hud_pids() {
            local queue="$hud_pid"
            local all=""
            while [ -n "$queue" ]; do
              local pid="${queue%% *}"
              queue="${queue#* }"
              if [ "$queue" = "$pid" ]; then queue=""; fi
              if ! kill -0 "$pid" 2>/dev/null; then continue; fi
              all="$all $pid"
              local children
              children="$(pgrep -P "$pid" | tr '\n' ' ' || true)"
              if [ -n "$children" ]; then queue="${queue:+$queue }$children"; fi
            done
            echo "$all" | xargs
          }

          sum_cpu_jiffies() {
            local total=0
            local pid
            for pid in $1; do
              if [ -r "/proc/$pid/stat" ]; then
                local ticks
                ticks="$(awk '{print $14 + $15}' "/proc/$pid/stat")"
                total=$((total + ticks))
              fi
            done
            echo "$total"
          }

          sum_pss_kb() {
            local total=0
            local pid
            for pid in $1; do
              if [ -r "/proc/$pid/smaps_rollup" ]; then
                local pss
                pss="$(awk '/^Pss:/ {print $2}' "/proc/$pid/smaps_rollup")"
                total=$((total + ${pss:-0}))
              fi
            done
            echo "$total"
          }

          sum_rss_kb() {
            local pids="$1"
            local pid_csv
            pid_csv="$(echo "$pids" | tr ' ' ',')"
            ps -o rss= -p "$pid_csv" | awk '{sum += $1} END {print sum + 0}'
          }

          # Wails/WebKit starts helper processes lazily. Wait long enough for the
          # native surface to settle before treating samples as idle.
          sleep 10
          hz="$(getconf CLK_TCK)"
          {
            echo "sha=${GITHUB_SHA}"
            echo "pid=$hud_pid"
            echo "session=${XDG_SESSION_TYPE}"
            echo "metric=process_tree_pss_rss_and_cpu_delta"
            echo "warmup_seconds=10"
            echo "samples:"
          } > "$metrics"
          for sample in $(seq 1 5); do
            pids_before="$(collect_hud_pids)"
            test -n "$pids_before"
            cpu_before="$(sum_cpu_jiffies "$pids_before")"
            sleep 1
            pids_after="$(collect_hud_pids)"
            test -n "$pids_after"
            cpu_after="$(sum_cpu_jiffies "$pids_after")"
            delta_ticks=$((cpu_after - cpu_before))
            if [ "$delta_ticks" -lt 0 ]; then delta_ticks=0; fi
            cpu_pct="$(awk -v ticks="$delta_ticks" -v hz="$hz" 'BEGIN {printf "%.2f", (ticks / hz) * 100}')"
            pss_kb="$(sum_pss_kb "$pids_after")"
            rss_kb="$(sum_rss_kb "$pids_after")"
            process_count="$(wc -w <<< "$pids_after" | xargs)"
            echo "sample=$sample pss_kb=$pss_kb rss_kb=$rss_kb cpu_pct=$cpu_pct process_count=$process_count pids=$pids_after" >> "$metrics"
          done
          echo "status=PASS" >> "$metrics"
          cat "$metrics"
      - name: Package Linux desktop surfaces
        run: |
          tar -C cmd/nexus-desktop/build/bin -czf "$RUNNER_TEMP/nexus-desktop_Linux_x86_64.tar.gz" nexus-desktop
          tar -C cmd/nexus-hud/build/bin -czf "$RUNNER_TEMP/nexus-hud_Linux_x86_64.tar.gz" nexus-hud
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nexus-desktop_Linux_x86_64.tar.gz
            ${{ runner.temp }}/nexus-hud_Linux_x86_64.tar.gz
            ${{ runner.temp }}/nexus-hud-linux-metrics.txt
            ${{ runner.temp }}/nexus-hud-linux-smoke.log
          if-no-files-found: error
          retention-days: 2


  cross-platform-compile:
    needs: workspace-sanitize
    name: Cross-platform compile guard
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - name: Compile Windows amd64 test graph
        shell: bash
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go test -exec=/bin/true -run '^$'             ./cmd/nexus             ./internal/runtime             ./internal/browser             ./internal/update             ./internal/control/...             ./internal/core/...             ./internal/nexus/...             ./internal/desktop
      - name: Compile macOS arm64 test graph
        shell: bash
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go test -exec=/bin/true -run '^$'             ./cmd/nexus             ./internal/runtime             ./internal/browser             ./internal/update             ./internal/control/...             ./internal/core/...             ./internal/nexus/...             ./internal/desktop

  native-windows:
    name: Windows native certification
    if: github.event_name == 'workflow_dispatch' && inputs.native_target_sha != '' && (inputs.native_platform == 'windows' || inputs.native_platform == 'all')
    runs-on: [self-hosted, Windows, X64, nexus-windows]
    environment: native-signing
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.native_target_sha }}
          fetch-depth: 0
      - name: Verify exact SHA and architecture
        shell: pwsh
        env:
          TARGET_SHA: ${{ inputs.native_target_sha }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:TARGET_SHA) { throw "Checked out $head, expected $env:TARGET_SHA" }
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected native Windows amd64 runner, got $env:PROCESSOR_ARCHITECTURE"
          }
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - name: Wails v2 + tray linker compatibility probe
        shell: pwsh
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: bun install --frozen-lockfile
      - working-directory: web
        run: bun run build
      - run: go vet ./...
      - name: Full Windows suite
        shell: pwsh
        run: go test -v ./...
      - name: ConPTY and Named Pipe E2E
        shell: pwsh
        run: go test -v -count=1 ./internal/control/terminal/... ./internal/control/protocol/...
      - name: Runtime and Web E2E
        shell: pwsh
        run: go test -v -count=1 ./internal/control/host/... ./internal/control/web/...
      - name: Verify signing and packaging prerequisites
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NEXUS_UPDATE_PUBLIC_KEY)) { throw "NEXUS_UPDATE_PUBLIC_KEY is required" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_BASE64)) { throw "WINDOWS_SIGNING_PFX_BASE64 is required" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_PFX_PASSWORD)) { throw "WINDOWS_SIGNING_PFX_PASSWORD is required" }
          Get-Command signtool.exe -ErrorAction Stop | Out-Null
          Get-Command makensis.exe -ErrorAction Stop | Out-Null
      - name: Build, Authenticode-sign and package Windows artifacts
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP "native-windows"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $pfx = Join-Path $env:RUNNER_TEMP "nexus-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))
          try {
            $version = (Get-Content VERSION -Raw).Trim()
            $commit = (git rev-parse --short HEAD).Trim()
            $buildDate = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            $ldflags = "-s -w -X github.com/IAPro-Community/nexus/internal/buildinfo.Version=$version -X github.com/IAPro-Community/nexus/internal/buildinfo.Commit=$commit -X github.com/IAPro-Community/nexus/internal/buildinfo.BuildDate=$buildDate -X github.com/IAPro-Community/nexus/internal/update.ProductionTrustRootHex=$env:NEXUS_UPDATE_PUBLIC_KEY"

            $cli = Join-Path $env:RUNNER_TEMP "nexus.exe"
            go build -trimpath -ldflags "$ldflags" -o $cli ./cmd/nexus

            Push-Location cmd/nexus-desktop
            try {
              go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -s -m -tags production -ldflags "$ldflags"
            } finally {
              Pop-Location
            }
            $desktop = Get-ChildItem cmd/nexus-desktop/build/bin -Filter *.exe | Select-Object -First 1
            if (-not $desktop) { throw "Wails Windows executable not found" }

            Push-Location cmd/nexus-hud
            try {
              go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -s -m -tags production -ldflags "$ldflags"
            } finally {
              Pop-Location
            }
            $hud = Get-ChildItem cmd/nexus-hud/build/bin -Filter *.exe | Select-Object -First 1
            if (-not $hud) { throw "Nexus HUD Windows executable not found" }

            $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
            foreach ($binary in @($cli, $desktop.FullName, $hud.FullName)) {
              & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_SIGNING_PFX_PASSWORD $binary
              if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $binary" }
              & $signtool verify /pa /all $binary
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $binary" }
            }

            & $cli version
            & $cli doctor --json | Out-File -Encoding utf8 (Join-Path $out "nexus-doctor-windows.json")

            Compress-Archive -Path $cli -DestinationPath (Join-Path $out "nexus_Windows_x86_64.zip") -Force
            Compress-Archive -Path $desktop.FullName -DestinationPath (Join-Path $out "nexus-desktop_Windows_x86_64.zip") -Force
            Compress-Archive -Path $hud.FullName -DestinationPath (Join-Path $out "nexus-hud_Windows_x86_64.zip") -Force

            $payload = Join-Path $PWD "packaging\windows\payload"
            Remove-Item $payload -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $payload -Force | Out-Null
            Copy-Item $cli (Join-Path $payload "nexus.exe") -Force
            Copy-Item $desktop.FullName (Join-Path $payload "nexus-desktop.exe") -Force
            Copy-Item $hud.FullName (Join-Path $payload "nexus-hud.exe") -Force
            Push-Location packaging/windows
            try {
              makensis.exe .\nexus.nsi
              if ($LASTEXITCODE -ne 0) { throw "NSIS build failed" }
            } finally {
              Pop-Location
            }
            $installer = Join-Path $PWD "packaging\windows\nexus-setup-Windows_x86_64.exe"
            & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_SIGNING_PFX_PASSWORD $installer
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for NSIS installer" }
            & $signtool verify /pa /all $installer
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for NSIS installer" }
            Copy-Item $installer (Join-Path $out "nexus-setup-Windows_x86_64.exe") -Force

            Get-AuthenticodeSignature $cli, $desktop.FullName, $hud.FullName, $installer |
              Select-Object Path,Status,StatusMessage,@{N='SignerSubject';E={$_.SignerCertificate.Subject}},@{N='Thumbprint';E={$_.SignerCertificate.Thumbprint}} |
              ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 (Join-Path $out "authenticode-evidence.json")
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }
      - name: Native Windows HUD launch smoke
        shell: pwsh
        env:
          TARGET_SHA: ${{ inputs.native_target_sha }}
          NEXUS_ENABLE_HUD: "1"
          NEXUS_DATA_DIR: ${{ runner.temp }}\nexus-hud-windows-smoke
        run: |
          $out = Join-Path $env:RUNNER_TEMP "native-windows"
          $hudExe = Get-ChildItem cmd/nexus-hud/build/bin -Filter *.exe | Select-Object -First 1
          if (-not $hudExe) { throw "Nexus HUD Windows executable not found" }
          $stdout = Join-Path $out "nexus-hud-windows-smoke.stdout.log"
          $stderr = Join-Path $out "nexus-hud-windows-smoke.stderr.log"
          $evidence = Join-Path $out "nexus-hud-windows-smoke.txt"
          $proc = Start-Process -FilePath $hudExe.FullName -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($proc.HasExited) { throw "Nexus HUD exited during Windows native smoke" }
            @(
              "sha=$env:TARGET_SHA"
              "pid=$($proc.Id)"
              "platform=windows"
              "status=PASS"
            ) | Out-File -Encoding utf8 $evidence
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - name: Smoke signed NSIS install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP "native-windows"
          $installer = Join-Path $out "nexus-setup-Windows_x86_64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "nexus-native-install"
          Remove-Item $installDir -Recurse -Force -ErrorAction SilentlyContinue
          & $installer /S "/D=$installDir"
          if ($LASTEXITCODE -ne 0) { throw "NSIS silent install failed" }
          $installed = Join-Path $installDir "nexus.exe"
          if (-not (Test-Path $installed)) { throw "NSIS did not install nexus.exe" }
          if (-not (Test-Path (Join-Path $installDir "nexus-desktop.exe"))) { throw "NSIS did not install Nexus Desktop" }
          if (-not (Test-Path (Join-Path $installDir "nexus-hud.exe"))) { throw "NSIS did not install Nexus HUD" }
          & $installed version
          & $installed doctor --json | Out-File -Encoding utf8 (Join-Path $out "nexus-doctor-windows-installed.json")
          $uninstaller = Join-Path $installDir "Uninstall.exe"
          if (-not (Test-Path $uninstaller)) { throw "NSIS uninstaller missing" }
          & $uninstaller /S
          if ($LASTEXITCODE -ne 0) { throw "NSIS silent uninstall failed" }
          Start-Sleep -Seconds 2
          if (Test-Path (Join-Path $installDir "nexus.exe")) { throw "nexus.exe remains after uninstall" }
          if (Test-Path (Join-Path $installDir "nexus-hud.exe")) { throw "Nexus HUD remains after uninstall" }
      - uses: actions/upload-artifact@v4
        with:
          name: native-windows-${{ inputs.native_target_sha }}
          path: ${{ runner.temp }}\native-windows\*
          if-no-files-found: error
          retention-days: 30

  native-macos:
    name: macOS arm64 native certification
    if: github.event_name == 'workflow_dispatch' && inputs.native_target_sha != '' && (inputs.native_platform == 'macos' || inputs.native_platform == 'all')
    runs-on: [self-hosted, macOS, ARM64, nexus-macos]
    environment: native-signing
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.native_target_sha }}
          fetch-depth: 0
      - name: Verify exact SHA and architecture
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.native_target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(uname -m)" = "arm64"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - name: Wails v2 + tray linker compatibility probe
        shell: bash
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: bun install --frozen-lockfile
      - working-directory: web
        run: bun run build
      - run: go vet ./...
      - name: Full macOS race suite
        run: go test -v -race ./...
      - name: PTY, Socket and Runtime E2E
        run: go test -race -v -count=1 ./internal/control/terminal/... ./internal/control/protocol/... ./internal/control/host/...
      - name: Web E2E
        run: go test -race -v -count=1 ./internal/control/web/...
      - name: Verify Apple signing and notarization prerequisites
        shell: bash
        env:
          APPLE_APP_CERT_P12_BASE64: ${{ secrets.APPLE_APP_CERT_P12_BASE64 }}
          APPLE_APP_CERT_PASSWORD: ${{ secrets.APPLE_APP_CERT_PASSWORD }}
          APPLE_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_UPDATE_PUBLIC_KEY"
          test -n "$APPLE_APP_CERT_P12_BASE64"
          test -n "$APPLE_APP_CERT_PASSWORD"
          test -n "$APPLE_INSTALLER_CERT_P12_BASE64"
          test -n "$APPLE_INSTALLER_CERT_PASSWORD"
          test -n "$APPLE_NOTARY_KEY_P8_BASE64"
          test -n "$APPLE_NOTARY_KEY_ID"
          test -n "$APPLE_NOTARY_ISSUER_ID"
          command -v codesign
          command -v pkgbuild
          xcrun notarytool --version
          sudo -n true
      - name: Build, sign, notarize and package macOS artifacts
        shell: bash
        env:
          APPLE_APP_CERT_P12_BASE64: ${{ secrets.APPLE_APP_CERT_P12_BASE64 }}
          APPLE_APP_CERT_PASSWORD: ${{ secrets.APPLE_APP_CERT_PASSWORD }}
          APPLE_INSTALLER_CERT_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERT_P12_BASE64 }}
          APPLE_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERT_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/native-macos"
          mkdir -p "$OUT"
          KEYCHAIN="$RUNNER_TEMP/nexus-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          APP_P12="$RUNNER_TEMP/app.p12"
          INSTALLER_P12="$RUNNER_TEMP/installer.p12"
          NOTARY_KEY="$RUNNER_TEMP/AuthKey.p8"
          cleanup() {
            security delete-keychain "$KEYCHAIN" >/dev/null 2>&1 || true
            rm -f "$APP_P12" "$INSTALLER_P12" "$NOTARY_KEY"
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_APP_CERT_P12_BASE64" | base64 -D > "$APP_P12"
          printf '%s' "$APPLE_INSTALLER_CERT_P12_BASE64" | base64 -D > "$INSTALLER_P12"
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" | base64 -D > "$NOTARY_KEY"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$APP_P12" -k "$KEYCHAIN" -P "$APPLE_APP_CERT_PASSWORD" -T /usr/bin/codesign
          security import "$INSTALLER_P12" -k "$KEYCHAIN" -P "$APPLE_INSTALLER_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          APP_IDENTITY="$(security find-identity -v "$KEYCHAIN" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          INSTALLER_IDENTITY="$(security find-identity -v "$KEYCHAIN" | awk -F'"' '/Developer ID Installer/{print $2; exit}')"
          test -n "$APP_IDENTITY"
          test -n "$INSTALLER_IDENTITY"

          VERSION="$(tr -d '\r\n' < VERSION)"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILDDATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X github.com/IAPro-Community/nexus/internal/buildinfo.Version=$VERSION -X github.com/IAPro-Community/nexus/internal/buildinfo.Commit=$COMMIT -X github.com/IAPro-Community/nexus/internal/buildinfo.BuildDate=$BUILDDATE -X github.com/IAPro-Community/nexus/internal/update.ProductionTrustRootHex=$NEXUS_UPDATE_PUBLIC_KEY"

          CLI="$RUNNER_TEMP/nexus"
          go build -trimpath -ldflags "$LDFLAGS" -o "$CLI" ./cmd/nexus
          codesign --force --options runtime --timestamp --sign "$APP_IDENTITY" "$CLI"
          codesign --verify --strict --verbose=2 "$CLI"
          "$CLI" version
          "$CLI" doctor --json > "$OUT/nexus-doctor-macos.json"
          tar -C "$RUNNER_TEMP" -czf "$OUT/nexus_Darwin_arm64.tar.gz" nexus

          (
            cd cmd/nexus-desktop
            go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -s -m -tags production -ldflags "$LDFLAGS"
          )
          APP="$(find cmd/nexus-desktop/build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          codesign --force --deep --options runtime --timestamp --sign "$APP_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          PRE_NOTARY_ZIP="$RUNNER_TEMP/nexus-desktop-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$PRE_NOTARY_ZIP"
          xcrun notarytool submit "$PRE_NOTARY_ZIP" --key "$NOTARY_KEY" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$OUT/nexus-desktop_Darwin_arm64.zip"

          (
            cd cmd/nexus-hud
            go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -s -m -tags production -ldflags "$LDFLAGS"
          )
          HUD_APP="$(find cmd/nexus-hud/build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$HUD_APP"
          codesign --force --deep --options runtime --timestamp --sign "$APP_IDENTITY" "$HUD_APP"
          codesign --verify --deep --strict --verbose=2 "$HUD_APP"
          HUD_NOTARY_ZIP="$RUNNER_TEMP/nexus-hud-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "$HUD_APP" "$HUD_NOTARY_ZIP"
          xcrun notarytool submit "$HUD_NOTARY_ZIP" --key "$NOTARY_KEY" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$HUD_APP"
          xcrun stapler validate "$HUD_APP"
          spctl --assess --type execute --verbose=2 "$HUD_APP"
          ditto -c -k --sequesterRsrc --keepParent "$HUD_APP" "$OUT/nexus-hud_Darwin_arm64.zip"

          PKGROOT="$RUNNER_TEMP/pkgroot"
          rm -rf "$PKGROOT"
          mkdir -p "$PKGROOT/usr/local/bin" "$PKGROOT/Applications"
          install -m 0755 "$CLI" "$PKGROOT/usr/local/bin/nexus"
          touch "$PKGROOT/usr/local/bin/.nexus-pkg"
          install -m 0755 packaging/macos/uninstall.sh "$PKGROOT/usr/local/bin/nexus-uninstall"
          ditto "$APP" "$PKGROOT/Applications/IAPro Nexus.app"
          ditto "$HUD_APP" "$PKGROOT/Applications/IAPro Nexus HUD.app"
          PKG="$OUT/nexus-installer_Darwin_arm64.pkg"
          pkgbuild --root "$PKGROOT" --identifier com.iapro.nexus --version "$VERSION" --install-location / --sign "$INSTALLER_IDENTITY" "$PKG"
          pkgutil --check-signature "$PKG"
          xcrun notarytool submit "$PKG" --key "$NOTARY_KEY" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$PKG"
          xcrun stapler validate "$PKG"
          spctl --assess --type install --verbose=2 "$PKG"

          {
            echo "app_identity=$APP_IDENTITY"
            echo "installer_identity=$INSTALLER_IDENTITY"
            codesign -dv --verbose=4 "$APP" 2>&1
            codesign -dv --verbose=4 "$HUD_APP" 2>&1
            pkgutil --check-signature "$PKG"
          } > "$OUT/apple-signing-evidence.txt"
      - name: Native macOS HUD launch smoke
        env:
          TARGET_SHA: ${{ inputs.native_target_sha }}
          NEXUS_ENABLE_HUD: "1"
          NEXUS_DATA_DIR: ${{ runner.temp }}/nexus-hud-macos-smoke
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/native-macos"
          HUD_APP="$(find cmd/nexus-hud/build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$HUD_APP"
          HUD_BIN="$(find "$HUD_APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$HUD_BIN"
          log="$OUT/nexus-hud-macos-smoke.log"
          evidence="$OUT/nexus-hud-macos-smoke.txt"
          "$HUD_BIN" >"$log" 2>&1 &
          pid=$!
          cleanup() { kill -TERM "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 8
          kill -0 "$pid"
          {
            echo "sha=$TARGET_SHA"
            echo "pid=$pid"
            echo "platform=darwin"
            echo "status=PASS"
          } >"$evidence"
      - name: Smoke notarized PKG install and uninstall
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/native-macos"
          PKG="$OUT/nexus-installer_Darwin_arm64.pkg"
          test ! -e /usr/local/bin/nexus
          test ! -e "/Applications/IAPro Nexus.app"
          test ! -e "/Applications/IAPro Nexus HUD.app"
          sudo installer -pkg "$PKG" -target /
          /usr/local/bin/nexus version
          test -e "/Applications/IAPro Nexus.app"
          test -e "/Applications/IAPro Nexus HUD.app"
          /usr/local/bin/nexus doctor --json > "$OUT/nexus-doctor-macos-installed.json"
          sudo /usr/local/bin/nexus-uninstall
          test ! -e /usr/local/bin/nexus
          test ! -e "/Applications/IAPro Nexus.app"
          test ! -e "/Applications/IAPro Nexus HUD.app"
      - uses: actions/upload-artifact@v4
        with:
          name: native-macos-${{ inputs.native_target_sha }}
          path: ${{ runner.temp }}/native-macos/*
          if-no-files-found: error
          retention-days: 30


  native-certification:
    name: Seal native certification evidence
    if: github.event_name == 'workflow_dispatch' && inputs.native_target_sha != '' && inputs.native_platform == 'all'
    needs: [native-windows, native-macos]
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-windows-${{ inputs.native_target_sha }}
          path: native/windows
      - uses: actions/download-artifact@v4
        with:
          name: native-macos-${{ inputs.native_target_sha }}
          path: native/macos
      - name: Seal exact-SHA native certificate
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.native_target_sha }}
        run: |
          set -euo pipefail
          test "${#TARGET_SHA}" -eq 40
          test -f native/windows/nexus_Windows_x86_64.zip
          test -f native/windows/nexus-desktop_Windows_x86_64.zip
          test -f native/windows/nexus-hud_Windows_x86_64.zip
          test -f native/windows/nexus-setup-Windows_x86_64.exe
          test -f native/windows/authenticode-evidence.json
          test -f native/windows/nexus-hud-windows-smoke.txt
          test -f native/macos/nexus_Darwin_arm64.tar.gz
          test -f native/macos/nexus-desktop_Darwin_arm64.zip
          test -f native/macos/nexus-hud_Darwin_arm64.zip
          test -f native/macos/nexus-installer_Darwin_arm64.pkg
          test -f native/macos/apple-signing-evidence.txt
          test -f native/macos/nexus-hud-macos-smoke.txt
          printf '%s\n' "$TARGET_SHA" > certified-sha.txt
          find native -type f -print0 | sort -z | xargs -0 sha256sum > native-artifacts.sha256
          {
            printf 'sha=%s\n' "$TARGET_SHA"
            printf 'windows_runner=self-hosted/windows/x64/nexus-windows\n'
            printf 'windows_signing=authenticode+timestamp\n'
            printf 'macos_runner=self-hosted/macos/arm64/nexus-macos\n'
            printf 'macos_signing=developer-id+notarization+stapling\n'
            printf 'installer_lifecycle=passed\n'
          } > native-certification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-certification-${{ inputs.native_target_sha }}
          path: |
            certified-sha.txt
            native-artifacts.sha256
            native-certification.txt
          if-no-files-found: error
          retention-days: 30

  snapshot:
    name: GoReleaser Snapshot Build
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    needs: [test-linux, frontend, desktop-linux]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --snapshot --clean
      - name: Verify Nexus v1 Linux amd64 artifacts
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test -f dist/nexus_Linux_x86_64.tar.gz
          test "$(find dist -maxdepth 1 -name 'nexus_Linux_*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*_linux_amd64.deb' -o -name '*_linux_x86_64.deb' | wc -l)" -ge 1
          test "$(find dist -maxdepth 1 -name '*.rpm' | wc -l)" -eq 0
          test "$(find dist -maxdepth 1 \( -name '*Darwin*' -o -name '*Windows*' -o -name '*arm64*' \) | wc -l)" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 2

  package-smoke-deb:
    name: Smoke DEB install
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    needs: snapshot
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snapshot-dist-${{ github.sha }}
          path: ${{ runner.temp }}/nexus-deb-smoke-dist
      - name: Install DEB and run nexus version
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find "$RUNNER_TEMP/nexus-deb-smoke-dist" -maxdepth 1 \( -name '*_linux_amd64.deb' -o -name '*_linux_x86_64.deb' \) | head -n1)"
          test -n "$deb"
          if ! dpkg -i "$deb"; then
            apt-get update
            apt-get install -f -y
          fi
          installed_path="$(command -v nexus)"
          test -n "$installed_path"
          nexus version
          dpkg -r nexus
          hash -r
          if [ -e "$installed_path" ]; then
            echo "nexus binary still exists after DEB uninstall: $installed_path" >&2
            exit 1
          fi
          if command -v nexus >/dev/null 2>&1; then
            echo "another nexus command is still resolvable after DEB uninstall: $(command -v nexus)" >&2
            exit 1
          fi
      - name: Clean container smoke artifacts
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/nexus-deb-smoke-dist"
