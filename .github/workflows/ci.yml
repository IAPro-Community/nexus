name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  NEXUS_UPDATE_PUBLIC_KEY: ${{ vars.NEXUS_UPDATE_PUBLIC_KEY }}

jobs:
  frontend:
    name: Frontend (Format, Lint, Styles, Typecheck, Unit & Build)
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: bun install --frozen-lockfile
      - working-directory: web
        run: bun run format:check
      - working-directory: web
        run: bun run typecheck
      - working-directory: web
        run: bun run lint
      - working-directory: web
        run: bun run lint:styles
      - working-directory: web
        run: bun run check:styles
      - working-directory: web
        run: bun run test
      - working-directory: web
        run: bun run build
      - working-directory: web
        run: bun run verify

  security:
    name: Security
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - run: GOTOOLCHAIN=local go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  browser:
    name: Browser E2E, Axe & visual smoke
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Chromium browser only
        working-directory: web
        run: bunx playwright install chromium
      - run: go build -trimpath -o nexus ./cmd/nexus
      - id: browser-e2e
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e 2>&1 | tee "$RUNNER_TEMP/nexus-browser-e2e.log"
      - id: surface-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:surface 2>&1 | tee "$RUNNER_TEMP/nexus-browser-surface.log"
      - id: capacity-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:capacity 2>&1 | tee "$RUNNER_TEMP/nexus-browser-capacity.log"
      - id: browser-a11y
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:a11y 2>&1 | tee "$RUNNER_TEMP/nexus-browser-a11y.log"
      - id: browser-visual
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:visual 2>&1 | tee "$RUNNER_TEMP/nexus-browser-visual.log"
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nexus-browser-*.log
            .tempmediaStorage/e2e-failure-diagnostics.json
            .tempmediaStorage/e2e-failure.png
            .tempmediaStorage/e2e-surface-failure-diagnostics.json
            .tempmediaStorage/e2e-surface-failure.png
          if-no-files-found: ignore
          retention-days: 2
      - if: always()
        run: |
          test '${{ steps.browser-e2e.outcome }}' = success
          test '${{ steps.surface-e2e.outcome }}' = success
          test '${{ steps.capacity-e2e.outcome }}' = success
          test '${{ steps.browser-a11y.outcome }}' = success
          test '${{ steps.browser-visual.outcome }}' = success

  test-linux:
    name: Linux E2E (Go 1.25.14)
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - run: test -z "$(gofmt -l . | grep -v .worktrees)" || (gofmt -l . | grep -v .worktrees && exit 1)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m
      - run: go test -v -race ./...
      - run: go test -race -v -count=1 ./internal/control/terminal/... ./internal/control/protocol/...
      - run: go test -race -v -count=1 ./internal/control/host/... ./internal/control/web/...
      - run: go build -trimpath -v ./cmd/nexus

  desktop-linux:
    name: Desktop Linux (Wails native build)
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Verify Wails system dependencies
        run: |
          pkg-config --exists gtk+-3.0
          pkg-config --exists webkit2gtk-4.1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: bun install --frozen-lockfile
      - name: Build Linux desktop
        run: |
          set -euo pipefail
          test -n "${NEXUS_UPDATE_PUBLIC_KEY}" || {
            echo "NEXUS_UPDATE_PUBLIC_KEY is required for desktop CI" >&2
            exit 1
          }
          make build-desktop-wails
          test -f cmd/nexus-desktop/build/bin/nexus-desktop
      - run: tar -C cmd/nexus-desktop/build/bin -czf "$RUNNER_TEMP/nexus-desktop_Linux_x86_64.tar.gz" nexus-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ github.sha }}
          path: ${{ runner.temp }}/nexus-desktop_Linux_x86_64.tar.gz
          if-no-files-found: error
          retention-days: 2

  snapshot:
    name: GoReleaser Snapshot Build
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    needs: [test-linux, frontend, desktop-linux]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --snapshot --clean
      - name: Verify Linux beta artifacts
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test -f dist/nexus_Linux_x86_64.tar.gz
          test -f dist/nexus_Linux_arm64.tar.gz
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" -ge 1
          test "$(find dist -maxdepth 1 -name '*.rpm' | wc -l)" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 2

  package-smoke-deb:
    name: Smoke DEB install
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    needs: snapshot
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snapshot-dist-${{ github.sha }}
          path: dist
      - name: Install DEB and run nexus version
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find dist -maxdepth 1 -name '*_linux_amd64.deb' -o -name '*_linux_x86_64.deb' | head -n1)"
          test -n "$deb"
          if ! dpkg -i "$deb"; then
            apt-get update
            apt-get install -f -y
          fi
          nexus version
