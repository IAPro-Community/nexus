name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  NEXUS_UPDATE_PUBLIC_KEY: ${{ vars.NEXUS_UPDATE_PUBLIC_KEY }}

jobs:
  frontend:
    name: Frontend (Format, Lint, Styles, Typecheck, Unit & Build)
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: bun install --frozen-lockfile
      - name: Verify frontend formatting
        working-directory: web
        run: |
          set -euo pipefail
          if bun run format:check; then
            exit 0
          fi
          mapfile -t files < <(bunx prettier --list-different 'src/**/*.{ts,tsx,css,json}')
          for file in "${files[@]}"; do
            [ -n "$file" ] || continue
            formatted="$RUNNER_TEMP/prettier-${file//\//_}"
            bunx prettier "$file" > "$formatted"
            echo "::group::prettier diff $file"
            diff -u "$file" "$formatted" || true
            echo "::endgroup::"
          done
          exit 1
      - working-directory: web
        run: bun run typecheck
      - working-directory: web
        run: bun run lint
      - working-directory: web
        run: bun run lint:styles
      - working-directory: web
        run: bun run check:styles
      - working-directory: web
        run: bun run test
      - working-directory: web
        run: bun run build
      - working-directory: web
        run: bun run verify

  security:
    name: Security
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - run: GOTOOLCHAIN=local go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  browser:
    name: Browser E2E, Axe & visual smoke
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Chromium browser only
        working-directory: web
        run: bunx playwright install chromium
      - run: go build -trimpath -o nexus ./cmd/nexus
      - id: browser-e2e
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e 2>&1 | tee "$RUNNER_TEMP/nexus-browser-e2e.log"
      - id: surface-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:surface 2>&1 | tee "$RUNNER_TEMP/nexus-browser-surface.log"
      - id: capacity-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:capacity 2>&1 | tee "$RUNNER_TEMP/nexus-browser-capacity.log"
      - id: composer-spine-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:composer-spine 2>&1 | tee "$RUNNER_TEMP/nexus-browser-composer-spine.log"
      - id: composer-vague-spine-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:composer-vague-spine 2>&1 | tee "$RUNNER_TEMP/nexus-browser-composer-vague-spine.log"
      - id: composer-theme-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:composer-themes 2>&1 | tee "$RUNNER_TEMP/nexus-browser-composer-themes.log"
      - id: browser-a11y
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:a11y 2>&1 | tee "$RUNNER_TEMP/nexus-browser-a11y.log"
      - id: browser-visual
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:visual 2>&1 | tee "$RUNNER_TEMP/nexus-browser-visual.log"
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nexus-browser-*.log
            .tempmediaStorage/e2e-failure-diagnostics.json
            .tempmediaStorage/e2e-failure.png
            .tempmediaStorage/e2e-surface-failure-diagnostics.json
            .tempmediaStorage/e2e-surface-failure.png
            .tempmediaStorage/composer-themes/
            DEV/validation/composer-execution-spine/
          if-no-files-found: ignore
          retention-days: 2
      - if: always()
        run: |
          test '${{ steps.browser-e2e.outcome }}' = success
          test '${{ steps.surface-e2e.outcome }}' = success
          test '${{ steps.capacity-e2e.outcome }}' = success
          test '${{ steps.composer-spine-e2e.outcome }}' = success
          test '${{ steps.composer-vague-spine-e2e.outcome }}' = success
          test '${{ steps.composer-theme-e2e.outcome }}' = success
          test '${{ steps.browser-a11y.outcome }}' = success
          test '${{ steps.browser-visual.outcome }}' = success

  test-linux:
    name: Linux E2E (Go 1.25.14)
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - name: Verify gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l . | grep -v '^./\.worktrees/' || true)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"
            printf '%s\n' "$unformatted"
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              echo "::group::gofmt diff $file"
              gofmt -d "$file"
              echo "::endgroup::"
            done <<< "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m
      - run: go test -v -race ./...
      - run: go test -race -v -count=1 ./internal/control/terminal/... ./internal/control/protocol/...
      - run: go test -race -v -count=1 ./internal/control/host/... ./internal/control/web/...
      - run: go build -trimpath -v ./cmd/nexus
      - name: Unix installer/uninstaller lifecycle smoke
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n uninstall.sh
          root="$(mktemp -d)"
          home="$root/home"
          prefix="$root/prefix"
          mkdir -p "$home/.local/share/applications" "$home/Desktop" "$home/.local/share/nexus" "$prefix/bin"
          touch "$prefix/bin/nexus" "$prefix/bin/nexus-desktop" "$prefix/bin/maestro" "$prefix/bin/orquestrador"
          touch "$home/.local/share/applications/iapro-nexus.desktop" "$home/Desktop/IAPro Nexus.desktop"
          printf '# existing\n# IAPro Nexus\nexport PATH="$HOME/.local/bin:$PATH"\n' > "$home/.bashrc"
          HOME="$home" PREFIX="$prefix" bash ./uninstall.sh
          HOME="$home" PREFIX="$prefix" bash ./uninstall.sh
          test ! -e "$prefix/bin/nexus"
          test ! -e "$prefix/bin/nexus-desktop"
          test ! -e "$home/.local/share/applications/iapro-nexus.desktop"
          test ! -e "$home/Desktop/IAPro Nexus.desktop"
          test -d "$home/.local/share/nexus"
          ! grep -Fq '# IAPro Nexus' "$home/.bashrc"
          grep -Fq '# existing' "$home/.bashrc"

  test-windows:
    name: Windows E2E (ConPTY, Named Pipe, PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - name: Verify native architecture
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected native Windows amd64 runner, got $env:PROCESSOR_ARCHITECTURE"
          }
      - run: go vet ./...
      - name: Full Windows suite
        shell: pwsh
        run: go test -v ./...
      - name: ConPTY and Named Pipe E2E
        shell: pwsh
        run: go test -v -count=1 ./internal/control/terminal/... ./internal/control/protocol/...
      - name: Runtime and Web E2E
        shell: pwsh
        run: go test -v -count=1 ./internal/control/host/... ./internal/control/web/...
      - name: Build and smoke CLI
        shell: pwsh
        run: |
          go build -trimpath -o nexus.exe ./cmd/nexus
          .\nexus.exe version
          .\nexus.exe doctor --json | Out-File -Encoding utf8 "$env:RUNNER_TEMP\nexus-doctor-windows.json"
      - name: Parse PowerShell installer/uninstaller and smoke uninstall
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw ./install.ps1))
          [void][scriptblock]::Create((Get-Content -Raw ./uninstall.ps1))
          $tmp = Join-Path $env:RUNNER_TEMP "nexus-uninstall-smoke"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Set-Content -Path (Join-Path $tmp "nexus.exe") -Value "fixture"
          ./uninstall.ps1 -InstallDir $tmp -SkipPathCleanup -SkipDesktopShortcut
          if (Test-Path $tmp) { throw "uninstall.ps1 did not remove the test install directory" }
          ./uninstall.ps1 -InstallDir $tmp -SkipPathCleanup -SkipDesktopShortcut
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-evidence-${{ github.sha }}
          path: ${{ runner.temp }}\nexus-doctor-windows.json
          if-no-files-found: ignore
          retention-days: 2

  test-macos:
    name: macOS E2E (PTY, Socket, arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - name: Verify native architecture
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
      - run: go vet ./...
      - name: Full macOS race suite
        run: go test -v -race ./...
      - name: PTY, Socket and Runtime E2E
        run: go test -race -v -count=1 ./internal/control/terminal/... ./internal/control/protocol/... ./internal/control/host/...
      - name: Web E2E
        run: go test -race -v -count=1 ./internal/control/web/...
      - name: Build and smoke CLI
        run: |
          set -euo pipefail
          go build -trimpath -o nexus ./cmd/nexus
          ./nexus version
          ./nexus doctor --json > "$RUNNER_TEMP/nexus-doctor-macos.json"
      - name: Parse Unix installer
        run: bash -n install.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-native-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/nexus-doctor-macos.json
          if-no-files-found: ignore
          retention-days: 2

  desktop-linux:
    name: Desktop Linux (Wails native build)
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    needs: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Verify Wails system dependencies
        run: |
          pkg-config --exists gtk+-3.0
          pkg-config --exists webkit2gtk-4.1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: bun install --frozen-lockfile
      - name: Build Linux desktop
        run: |
          set -euo pipefail
          test -n "${NEXUS_UPDATE_PUBLIC_KEY}" || {
            echo "NEXUS_UPDATE_PUBLIC_KEY is required for desktop CI" >&2
            exit 1
          }
          make build-desktop-wails
          test -f cmd/nexus-desktop/build/bin/nexus-desktop
      - run: tar -C cmd/nexus-desktop/build/bin -czf "$RUNNER_TEMP/nexus-desktop_Linux_x86_64.tar.gz" nexus-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ github.sha }}
          path: ${{ runner.temp }}/nexus-desktop_Linux_x86_64.tar.gz
          if-no-files-found: error
          retention-days: 2

  desktop-windows:
    name: Desktop Windows (Wails native build)
    runs-on: windows-latest
    needs: [frontend, test-windows]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: bun install --frozen-lockfile
      - name: Build Windows desktop
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NEXUS_UPDATE_PUBLIC_KEY)) {
            throw "NEXUS_UPDATE_PUBLIC_KEY is required for desktop CI"
          }
          $version = (Get-Content VERSION -Raw).Trim()
          $commit = (git rev-parse --short HEAD).Trim()
          $buildDate = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
          $ldflags = "-s -w -X github.com/IAPro-Community/nexus/internal/buildinfo.Version=$version -X github.com/IAPro-Community/nexus/internal/buildinfo.Commit=$commit -X github.com/IAPro-Community/nexus/internal/buildinfo.BuildDate=$buildDate -X github.com/IAPro-Community/nexus/internal/update.ProductionTrustRootHex=$env:NEXUS_UPDATE_PUBLIC_KEY"
          Push-Location cmd/nexus-desktop
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -s -m -tags production -ldflags "$ldflags"
          Pop-Location
          $exe = Get-ChildItem cmd/nexus-desktop/build/bin -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "Wails Windows executable not found" }
          Compress-Archive -Path $exe.FullName -DestinationPath "$env:RUNNER_TEMP\nexus-desktop_Windows_x86_64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ github.sha }}
          path: ${{ runner.temp }}\nexus-desktop_Windows_x86_64.zip
          if-no-files-found: error
          retention-days: 2

  desktop-macos:
    name: Desktop macOS arm64 (Wails native build)
    runs-on: macos-15
    needs: [frontend, test-macos]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: bun install --frozen-lockfile
      - name: Build macOS arm64 desktop app
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          test -n "$NEXUS_UPDATE_PUBLIC_KEY"
          VERSION="$(tr -d '\r\n' < VERSION)"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILDDATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X github.com/IAPro-Community/nexus/internal/buildinfo.Version=$VERSION -X github.com/IAPro-Community/nexus/internal/buildinfo.Commit=$COMMIT -X github.com/IAPro-Community/nexus/internal/buildinfo.BuildDate=$BUILDDATE -X github.com/IAPro-Community/nexus/internal/update.ProductionTrustRootHex=$NEXUS_UPDATE_PUBLIC_KEY"
          (
            cd cmd/nexus-desktop
            go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -s -m -tags production -ldflags "$LDFLAGS"
          )
          APP="$(find cmd/nexus-desktop/build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/nexus-desktop_Darwin_arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ github.sha }}
          path: ${{ runner.temp }}/nexus-desktop_Darwin_arm64.zip
          if-no-files-found: error
          retention-days: 2

  snapshot:
    name: GoReleaser Snapshot Build
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    needs: [test-linux, test-windows, test-macos, frontend, desktop-linux, desktop-windows, desktop-macos]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --snapshot --clean
      - name: Verify cross-platform CLI artifacts
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test -f dist/nexus_Linux_x86_64.tar.gz
          test -f dist/nexus_Linux_arm64.tar.gz
          test -f dist/nexus_Darwin_x86_64.tar.gz
          test -f dist/nexus_Darwin_arm64.tar.gz
          test -f dist/nexus_Windows_x86_64.zip
          test -f dist/nexus_Windows_arm64.zip
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" -ge 1
          test "$(find dist -maxdepth 1 -name '*.rpm' | wc -l)" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 2

  package-smoke-deb:
    name: Smoke DEB install
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    needs: snapshot
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snapshot-dist-${{ github.sha }}
          path: dist
      - name: Install DEB and run nexus version
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find dist -maxdepth 1 -name '*_linux_amd64.deb' -o -name '*_linux_x86_64.deb' | head -n1)"
          test -n "$deb"
          if ! dpkg -i "$deb"; then
            apt-get update
            apt-get install -f -y
          fi
          nexus version
          dpkg -r nexus
          if command -v nexus >/dev/null 2>&1; then
            echo "nexus command still present after DEB uninstall" >&2
            exit 1
          fi
