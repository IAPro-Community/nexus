name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      native_target_sha:
        description: Full commit SHA to certify on Windows/macOS (leave empty for regular CI)
        required: false
        default: ''
        type: string

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  NEXUS_UPDATE_PUBLIC_KEY: ${{ vars.NEXUS_UPDATE_PUBLIC_KEY }}

jobs:
  frontend:
    name: Frontend (Format, Lint, Styles, Typecheck, Unit & Build)
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - name: Recover reusable runner workspace
        shell: bash
        run: |
          set -euo pipefail
          stale="$GITHUB_WORKSPACE/../dist-root-stale-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          if [ -d "$GITHUB_WORKSPACE/dist" ]; then
            rm -rf "$GITHUB_WORKSPACE/dist" 2>/dev/null || mv "$GITHUB_WORKSPACE/dist" "$stale"
          fi
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Verify documentation
        run: bun scripts/docs-verify.mjs
      - working-directory: web
        run: bun install --frozen-lockfile
      - name: Verify frontend formatting
        working-directory: web
        run: |
          set -euo pipefail
          if bun run format:check; then
            exit 0
          fi
          mapfile -t files < <(bunx prettier --list-different 'src/**/*.{ts,tsx,css,json}')
          for file in "${files[@]}"; do
            [ -n "$file" ] || continue
            formatted="$RUNNER_TEMP/prettier-${file//\//_}"
            bunx prettier "$file" > "$formatted"
            echo "::group::prettier diff $file"
            diff -u "$file" "$formatted" || true
            echo "::endgroup::"
          done
          exit 1
      - working-directory: web
        run: bun run typecheck
      - working-directory: web
        run: bun run lint
      - working-directory: web
        run: bun run lint:styles
      - working-directory: web
        run: bun run check:styles
      - working-directory: web
        run: bun run test
      - working-directory: web
        run: bun run build
      - working-directory: web
        run: bun run verify

  release-config:
    name: Release configuration
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - name: Recover reusable runner workspace
        shell: bash
        run: |
          set -euo pipefail
          stale="$GITHUB_WORKSPACE/../dist-root-stale-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          if [ -d "$GITHUB_WORKSPACE/dist" ]; then
            rm -rf "$GITHUB_WORKSPACE/dist" 2>/dev/null || mv "$GITHUB_WORKSPACE/dist" "$stale"
          fi
      - uses: actions/checkout@v5
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: check

  security:
    name: Security
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - name: Recover reusable runner workspace
        shell: bash
        run: |
          set -euo pipefail
          stale="$GITHUB_WORKSPACE/../dist-root-stale-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          if [ -d "$GITHUB_WORKSPACE/dist" ]; then
            rm -rf "$GITHUB_WORKSPACE/dist" 2>/dev/null || mv "$GITHUB_WORKSPACE/dist" "$stale"
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - run: GOTOOLCHAIN=local go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  browser:
    name: Browser E2E, Axe & visual smoke
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    needs: frontend
    steps:
      - name: Recover reusable runner workspace
        shell: bash
        run: |
          set -euo pipefail
          stale="$GITHUB_WORKSPACE/../dist-root-stale-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          if [ -d "$GITHUB_WORKSPACE/dist" ]; then
            rm -rf "$GITHUB_WORKSPACE/dist" 2>/dev/null || mv "$GITHUB_WORKSPACE/dist" "$stale"
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: bun install --frozen-lockfile
      - name: Build exact-SHA frontend for embedded browser runtime
        working-directory: web
        run: bun run build
      - name: Install Chromium browser only
        working-directory: web
        run: bunx playwright install chromium
      - run: go build -trimpath -o nexus ./cmd/nexus
      - id: browser-e2e
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e 2>&1 | tee "$RUNNER_TEMP/nexus-browser-e2e.log"
      - id: surface-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:surface 2>&1 | tee "$RUNNER_TEMP/nexus-browser-surface.log"
      - id: capacity-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:capacity 2>&1 | tee "$RUNNER_TEMP/nexus-browser-capacity.log"
      - id: hud-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:hud 2>&1 | tee "$RUNNER_TEMP/nexus-browser-hud.log"
      - id: composer-spine-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:composer-spine 2>&1 | tee "$RUNNER_TEMP/nexus-browser-composer-spine.log"
      - id: composer-vague-spine-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:composer-vague-spine 2>&1 | tee "$RUNNER_TEMP/nexus-browser-composer-vague-spine.log"
      - id: composer-theme-e2e
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:e2e:composer-themes 2>&1 | tee "$RUNNER_TEMP/nexus-browser-composer-themes.log"
      - id: browser-a11y
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:a11y 2>&1 | tee "$RUNNER_TEMP/nexus-browser-a11y.log"
      - id: browser-visual
        if: always()
        working-directory: web
        run: |
          set -o pipefail
          bun run test:visual 2>&1 | tee "$RUNNER_TEMP/nexus-browser-visual.log"
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nexus-browser-*.log
            .tempmediaStorage/e2e-failure-diagnostics.json
            .tempmediaStorage/e2e-failure.png
            .tempmediaStorage/e2e-surface-failure-diagnostics.json
            .tempmediaStorage/e2e-surface-failure.png
            .tempmediaStorage/hud/
            .tempmediaStorage/composer-themes/
            DEV/validation/composer-execution-spine/
          if-no-files-found: ignore
          retention-days: 2
      - name: Upload Nexus HUD Web evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-web-evidence-${{ github.sha }}
          path: |
            .tempmediaStorage/hud/
            ${{ runner.temp }}/nexus-browser-hud.log
          if-no-files-found: error
          retention-days: 14
      - if: always()
        run: |
          test '${{ steps.browser-e2e.outcome }}' = success
          test '${{ steps.surface-e2e.outcome }}' = success
          test '${{ steps.capacity-e2e.outcome }}' = success
          test '${{ steps.hud-e2e.outcome }}' = success
          test '${{ steps.composer-spine-e2e.outcome }}' = success
          test '${{ steps.composer-vague-spine-e2e.outcome }}' = success
          test '${{ steps.composer-theme-e2e.outcome }}' = success
          test '${{ steps.browser-a11y.outcome }}' = success
          test '${{ steps.browser-visual.outcome }}' = success

  test-linux:
    name: Linux E2E (Go 1.25.14)
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - name: Recover reusable runner workspace
        shell: bash
        run: |
          set -euo pipefail
          stale="$GITHUB_WORKSPACE/../dist-root-stale-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          if [ -d "$GITHUB_WORKSPACE/dist" ]; then
            rm -rf "$GITHUB_WORKSPACE/dist" 2>/dev/null || mv "$GITHUB_WORKSPACE/dist" "$stale"
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - name: Verify gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l . | grep -v '^./\.worktrees/' || true)"
          if [ -n "$unformatted" ]; then
            echo "gofmt required for:"
            printf '%s\n' "$unformatted"
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              echo "::group::gofmt diff $file"
              gofmt -d "$file"
              echo "::endgroup::"
            done <<< "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m
      - run: go test -v -race ./...
      - run: go test -race -v -count=1 ./internal/control/terminal/... ./internal/control/protocol/...
      - run: go test -race -v -count=1 ./internal/control/host/... ./internal/control/web/...
      - run: go build -trimpath -v ./cmd/nexus
      - name: Unix installer/uninstaller lifecycle smoke
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n uninstall.sh
          root="$(mktemp -d)"
          home="$root/home"
          prefix="$root/prefix"
          mkdir -p "$home/.local/share/applications" "$home/Desktop" "$home/.local/share/nexus" "$prefix/bin"
          touch "$prefix/bin/nexus" "$prefix/bin/nexus-desktop" "$prefix/bin/maestro" "$prefix/bin/orquestrador"
          touch "$home/.local/share/applications/iapro-nexus.desktop" "$home/Desktop/IAPro Nexus.desktop"
          printf '# existing\n# IAPro Nexus\nexport PATH="$HOME/.local/bin:$PATH"\n' > "$home/.bashrc"
          HOME="$home" PREFIX="$prefix" bash ./uninstall.sh
          HOME="$home" PREFIX="$prefix" bash ./uninstall.sh
          test ! -e "$prefix/bin/nexus"
          test ! -e "$prefix/bin/nexus-desktop"
          test ! -e "$home/.local/share/applications/iapro-nexus.desktop"
          test ! -e "$home/Desktop/IAPro Nexus.desktop"
          test -d "$home/.local/share/nexus"
          ! grep -Fq '# IAPro Nexus' "$home/.bashrc"
          grep -Fq '# existing' "$home/.bashrc"

  desktop-linux:
    name: Desktop Linux (Wails native build)
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    needs: frontend
    steps:
      - name: Recover reusable runner workspace
        shell: bash
        run: |
          set -euo pipefail
          stale="$GITHUB_WORKSPACE/../dist-root-stale-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          if [ -d "$GITHUB_WORKSPACE/dist" ]; then
            rm -rf "$GITHUB_WORKSPACE/dist" 2>/dev/null || mv "$GITHUB_WORKSPACE/dist" "$stale"
          fi
      - uses: actions/checkout@v5
      - name: Verify Wails system dependencies
        run: |
          pkg-config --exists gtk+-3.0
          pkg-config --exists webkit2gtk-4.1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - name: Wails v2 + tray linker compatibility probe
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/nexus-hud-tray-link-probe"
          rm -rf "$probe"
          mkdir -p "$probe"
          cat > "$probe/go.mod" <<'EOF'
          module nexus-hud-tray-link-probe

          go 1.25.0

          require (
            github.com/gogpu/systray v0.2.8
            github.com/wailsapp/wails/v2 v2.15.0
          )
          EOF
          cat > "$probe/main.go" <<'EOF'
          package main

          import (
            "fmt"

            "github.com/gogpu/systray"
            "github.com/wailsapp/wails/v2"
          )

          func main() {
            fmt.Printf("%T %T\n", systray.New, wails.Run)
          }
          EOF
          (
            cd "$probe"
            GOFLAGS=-mod=mod go mod download
            GOFLAGS=-mod=mod go build -trimpath -o tray-link-probe .
          )
          test -x "$probe/tray-link-probe"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: bun install --frozen-lockfile
      - name: Build Linux desktop
        run: |
          set -euo pipefail
          test -n "${NEXUS_UPDATE_PUBLIC_KEY}" || {
            echo "NEXUS_UPDATE_PUBLIC_KEY is required for desktop CI" >&2
            exit 1
          }
          make build-desktop-wails
          test -f cmd/nexus-desktop/build/bin/nexus-desktop
          make build-hud-wails
          test -f cmd/nexus-hud/build/bin/nexus-hud
      - name: Native HUD launch smoke and resource sample
        env:
          NEXUS_ENABLE_HUD: "1"
          NEXUS_DATA_DIR: ${{ runner.temp }}/nexus-hud-smoke-data
          XDG_SESSION_TYPE: x11
        run: |
          set -euo pipefail
          command -v xvfb-run >/dev/null
          command -v dbus-run-session >/dev/null
          metrics="$RUNNER_TEMP/nexus-hud-linux-metrics.txt"
          log="$RUNNER_TEMP/nexus-hud-linux-smoke.log"
          binary="$PWD/cmd/nexus-hud/build/bin/nexus-hud"
          dbus-run-session -- xvfb-run -a "$binary" >"$log" 2>&1 &
          launcher=$!
          cleanup() {
            hud_pid="$(pgrep -x nexus-hud | head -n1 || true)"
            if [ -n "$hud_pid" ]; then kill -TERM "$hud_pid" 2>/dev/null || true; fi
            kill -TERM "$launcher" 2>/dev/null || true
            wait "$launcher" 2>/dev/null || true
          }
          trap cleanup EXIT

          hud_pid=""
          for attempt in $(seq 1 30); do
            hud_pid="$(pgrep -x nexus-hud | head -n1 || true)"
            if [ -n "$hud_pid" ] && kill -0 "$hud_pid" 2>/dev/null; then break; fi
            if ! kill -0 "$launcher" 2>/dev/null; then
              cat "$log"
              echo "Nexus HUD exited before native smoke became ready" >&2
              exit 1
            fi
            sleep 1
          done
          test -n "$hud_pid"
          kill -0 "$hud_pid"

          collect_hud_pids() {
            local queue="$hud_pid"
            local all=""
            while [ -n "$queue" ]; do
              local pid="${queue%% *}"
              queue="${queue#* }"
              if [ "$queue" = "$pid" ]; then queue=""; fi
              if ! kill -0 "$pid" 2>/dev/null; then continue; fi
              all="$all $pid"
              local children
              children="$(pgrep -P "$pid" | tr '\n' ' ' || true)"
              if [ -n "$children" ]; then queue="${queue:+$queue }$children"; fi
            done
            echo "$all" | xargs
          }

          sum_cpu_jiffies() {
            local total=0
            local pid
            for pid in $1; do
              if [ -r "/proc/$pid/stat" ]; then
                local ticks
                ticks="$(awk '{print $14 + $15}' "/proc/$pid/stat")"
                total=$((total + ticks))
              fi
            done
            echo "$total"
          }

          sum_pss_kb() {
            local total=0
            local pid
            for pid in $1; do
              if [ -r "/proc/$pid/smaps_rollup" ]; then
                local pss
                pss="$(awk '/^Pss:/ {print $2}' "/proc/$pid/smaps_rollup")"
                total=$((total + ${pss:-0}))
              fi
            done
            echo "$total"
          }

          sum_rss_kb() {
            local pids="$1"
            local pid_csv
            pid_csv="$(echo "$pids" | tr ' ' ',')"
            ps -o rss= -p "$pid_csv" | awk '{sum += $1} END {print sum + 0}'
          }

          # Wails/WebKit starts helper processes lazily. Wait long enough for the
          # native surface to settle before treating samples as idle.
          sleep 10
          hz="$(getconf CLK_TCK)"
          {
            echo "sha=${GITHUB_SHA}"
            echo "pid=$hud_pid"
            echo "session=${XDG_SESSION_TYPE}"
            echo "metric=process_tree_pss_rss_and_cpu_delta"
            echo "warmup_seconds=10"
            echo "samples:"
          } > "$metrics"
          for sample in $(seq 1 5); do
            pids_before="$(collect_hud_pids)"
            test -n "$pids_before"
            cpu_before="$(sum_cpu_jiffies "$pids_before")"
            sleep 1
            pids_after="$(collect_hud_pids)"
            test -n "$pids_after"
            cpu_after="$(sum_cpu_jiffies "$pids_after")"
            delta_ticks=$((cpu_after - cpu_before))
            if [ "$delta_ticks" -lt 0 ]; then delta_ticks=0; fi
            cpu_pct="$(awk -v ticks="$delta_ticks" -v hz="$hz" 'BEGIN {printf "%.2f", (ticks / hz) * 100}')"
            pss_kb="$(sum_pss_kb "$pids_after")"
            rss_kb="$(sum_rss_kb "$pids_after")"
            process_count="$(wc -w <<< "$pids_after" | xargs)"
            echo "sample=$sample pss_kb=$pss_kb rss_kb=$rss_kb cpu_pct=$cpu_pct process_count=$process_count pids=$pids_after" >> "$metrics"
          done
          echo "status=PASS" >> "$metrics"
          cat "$metrics"
      - name: Package Linux desktop surfaces
        run: |
          tar -C cmd/nexus-desktop/build/bin -czf "$RUNNER_TEMP/nexus-desktop_Linux_x86_64.tar.gz" nexus-desktop
          tar -C cmd/nexus-hud/build/bin -czf "$RUNNER_TEMP/nexus-hud_Linux_x86_64.tar.gz" nexus-hud
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-${{ github.sha }}
          path: |
            ${{ runner.temp }}/nexus-desktop_Linux_x86_64.tar.gz
            ${{ runner.temp }}/nexus-hud_Linux_x86_64.tar.gz
            ${{ runner.temp }}/nexus-hud-linux-metrics.txt
            ${{ runner.temp }}/nexus-hud-linux-smoke.log
          if-no-files-found: error
          retention-days: 2


  native-windows:
    name: Windows native certification
    if: (github.event_name == 'workflow_dispatch' && inputs.native_target_sha != '') || (github.event_name == 'pull_request' && github.head_ref == 'feat/hud-cross-platform-completion')
    runs-on: [self-hosted, Windows, X64, nexus-windows]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.native_target_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact SHA and architecture
        shell: pwsh
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.native_target_sha || github.event.pull_request.head.sha }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:TARGET_SHA) { throw "Checked out $head, expected $env:TARGET_SHA" }
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected native Windows amd64 runner, got $env:PROCESSOR_ARCHITECTURE"
          }
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - name: Wails v2 + tray linker compatibility probe
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP "nexus-hud-tray-link-probe"
          Remove-Item -Recurse -Force $probe -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $probe -Force | Out-Null
          @'
          module nexus-hud-tray-link-probe

          go 1.25.0

          require (
            github.com/gogpu/systray v0.2.8
            github.com/wailsapp/wails/v2 v2.15.0
          )
          '@ | Set-Content -Encoding utf8 (Join-Path $probe "go.mod")
          @'
          package main

          import (
            "fmt"

            "github.com/gogpu/systray"
            "github.com/wailsapp/wails/v2"
          )

          func main() {
            fmt.Printf("%T %T\n", systray.New, wails.Run)
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $probe "main.go")
          Push-Location $probe
          try {
            $env:GOFLAGS = "-mod=mod"
            go mod download
            go build -trimpath -o tray-link-probe.exe .
            if (-not (Test-Path ".\tray-link-probe.exe")) { throw "tray link probe binary missing" }
          } finally {
            Pop-Location
          }
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: bun install --frozen-lockfile
      - run: go vet ./...
      - name: Full Windows suite
        shell: pwsh
        run: go test -v ./...
      - name: ConPTY and Named Pipe E2E
        shell: pwsh
        run: go test -v -count=1 ./internal/control/terminal/... ./internal/control/protocol/...
      - name: Runtime and Web E2E
        shell: pwsh
        run: go test -v -count=1 ./internal/control/host/... ./internal/control/web/...
      - name: Build and smoke CLI
        shell: pwsh
        run: |
          go build -trimpath -o nexus.exe ./cmd/nexus
          .\nexus.exe version
          .\nexus.exe doctor --json | Out-File -Encoding utf8 "$env:RUNNER_TEMP\nexus-doctor-windows.json"
      - name: Parse installer/uninstaller and smoke uninstall
        shell: pwsh
        run: |
          [void][scriptblock]::Create((Get-Content -Raw ./install.ps1))
          [void][scriptblock]::Create((Get-Content -Raw ./uninstall.ps1))
          $tmp = Join-Path $env:RUNNER_TEMP "nexus-uninstall-smoke"
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Set-Content -Path (Join-Path $tmp "nexus.exe") -Value "fixture"
          ./uninstall.ps1 -InstallDir $tmp -SkipPathCleanup -SkipDesktopShortcut
          if (Test-Path $tmp) { throw "uninstall.ps1 did not remove the test install directory" }
          ./uninstall.ps1 -InstallDir $tmp -SkipPathCleanup -SkipDesktopShortcut
      - name: Build Windows desktop
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NEXUS_UPDATE_PUBLIC_KEY)) {
            throw "NEXUS_UPDATE_PUBLIC_KEY is required for native desktop certification"
          }
          $version = (Get-Content VERSION -Raw).Trim()
          $commit = (git rev-parse --short HEAD).Trim()
          $buildDate = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
          $ldflags = "-s -w -X github.com/IAPro-Community/nexus/internal/buildinfo.Version=$version -X github.com/IAPro-Community/nexus/internal/buildinfo.Commit=$commit -X github.com/IAPro-Community/nexus/internal/buildinfo.BuildDate=$buildDate -X github.com/IAPro-Community/nexus/internal/update.ProductionTrustRootHex=$env:NEXUS_UPDATE_PUBLIC_KEY"
          Push-Location cmd/nexus-desktop
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -s -m -tags production -ldflags "$ldflags"
          Pop-Location
          $exe = Get-ChildItem cmd/nexus-desktop/build/bin -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "Wails Windows executable not found" }
          Compress-Archive -Path $exe.FullName -DestinationPath "$env:RUNNER_TEMP\nexus-desktop_Windows_x86_64.zip" -Force
          Push-Location cmd/nexus-hud
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -s -m -tags production -ldflags "$ldflags"
          Pop-Location
          $hudExe = Get-ChildItem cmd/nexus-hud/build/bin -Filter *.exe | Select-Object -First 1
          if (-not $hudExe) { throw "Nexus HUD Windows executable not found" }
          Compress-Archive -Path $hudExe.FullName -DestinationPath "$env:RUNNER_TEMP\nexus-hud_Windows_x86_64.zip" -Force
      - name: Native Windows HUD launch smoke
        shell: pwsh
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.native_target_sha || github.event.pull_request.head.sha }}
          NEXUS_ENABLE_HUD: "1"
          NEXUS_DATA_DIR: ${{ runner.temp }}\nexus-hud-windows-smoke
        run: |
          $hudExe = Get-ChildItem cmd/nexus-hud/build/bin -Filter *.exe | Select-Object -First 1
          if (-not $hudExe) { throw "Nexus HUD Windows executable not found" }
          $stdout = Join-Path $env:RUNNER_TEMP "nexus-hud-windows-smoke.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "nexus-hud-windows-smoke.stderr.log"
          $evidence = Join-Path $env:RUNNER_TEMP "nexus-hud-windows-smoke.txt"
          $proc = Start-Process -FilePath $hudExe.FullName -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            Start-Sleep -Seconds 8
            if ($proc.HasExited) { throw "Nexus HUD exited during Windows native smoke" }
            @(
              "sha=$env:TARGET_SHA"
              "pid=$($proc.Id)"
              "platform=windows"
              "status=PASS"
            ) | Out-File -Encoding utf8 $evidence
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ github.event_name == 'workflow_dispatch' && inputs.native_target_sha || github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}\nexus-desktop_Windows_x86_64.zip
            ${{ runner.temp }}\nexus-hud_Windows_x86_64.zip
            ${{ runner.temp }}\nexus-hud-windows-smoke.txt
            ${{ runner.temp }}\nexus-hud-windows-smoke.stdout.log
            ${{ runner.temp }}\nexus-hud-windows-smoke.stderr.log
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-evidence-${{ github.event_name == 'workflow_dispatch' && inputs.native_target_sha || github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}\nexus-doctor-windows.json
          if-no-files-found: warn
          retention-days: 30

  native-macos:
    name: macOS arm64 native certification
    if: (github.event_name == 'workflow_dispatch' && inputs.native_target_sha != '') || (github.event_name == 'pull_request' && github.head_ref == 'feat/hud-cross-platform-completion')
    runs-on: [self-hosted, macOS, ARM64, nexus-macos]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.native_target_sha || github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify exact SHA and architecture
        shell: bash
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.native_target_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(uname -m)" = "arm64"
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - name: Wails v2 + tray linker compatibility probe
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/nexus-hud-tray-link-probe"
          rm -rf "$probe"
          mkdir -p "$probe"
          cat > "$probe/go.mod" <<'EOF'
          module nexus-hud-tray-link-probe

          go 1.25.0

          require (
            github.com/gogpu/systray v0.2.8
            github.com/wailsapp/wails/v2 v2.15.0
          )
          EOF
          cat > "$probe/main.go" <<'EOF'
          package main

          import (
            "fmt"

            "github.com/gogpu/systray"
            "github.com/wailsapp/wails/v2"
          )

          func main() {
            fmt.Printf("%T %T\n", systray.New, wails.Run)
          }
          EOF
          (
            cd "$probe"
            GOFLAGS=-mod=mod go mod download
            GOFLAGS=-mod=mod go build -trimpath -o tray-link-probe .
          )
          test -x "$probe/tray-link-probe"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: bun install --frozen-lockfile
      - run: go vet ./...
      - name: Full macOS race suite
        run: go test -v -race ./...
      - name: PTY, Socket and Runtime E2E
        run: go test -race -v -count=1 ./internal/control/terminal/... ./internal/control/protocol/... ./internal/control/host/...
      - name: Web E2E
        run: go test -race -v -count=1 ./internal/control/web/...
      - name: Build and smoke CLI
        run: |
          set -euo pipefail
          go build -trimpath -o nexus ./cmd/nexus
          ./nexus version
          ./nexus doctor --json > "$RUNNER_TEMP/nexus-doctor-macos.json"
      - name: Parse Unix installer
        run: bash -n install.sh
      - name: Build macOS arm64 desktop app
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXUS_UPDATE_PUBLIC_KEY"
          VERSION="$(tr -d '\r\n' < VERSION)"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILDDATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w -X github.com/IAPro-Community/nexus/internal/buildinfo.Version=$VERSION -X github.com/IAPro-Community/nexus/internal/buildinfo.Commit=$COMMIT -X github.com/IAPro-Community/nexus/internal/buildinfo.BuildDate=$BUILDDATE -X github.com/IAPro-Community/nexus/internal/update.ProductionTrustRootHex=$NEXUS_UPDATE_PUBLIC_KEY"
          (
            cd cmd/nexus-desktop
            go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -s -m -tags production -ldflags "$LDFLAGS"
          )
          APP="$(find cmd/nexus-desktop/build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/nexus-desktop_Darwin_arm64.zip"
          (
            cd cmd/nexus-hud
            go run github.com/wailsapp/wails/v2/cmd/wails@v2.15.0 build -clean -s -m -tags production -ldflags "$LDFLAGS"
          )
          HUD_APP="$(find cmd/nexus-hud/build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$HUD_APP"
          ditto -c -k --sequesterRsrc --keepParent "$HUD_APP" "$RUNNER_TEMP/nexus-hud_Darwin_arm64.zip"
      - name: Native macOS HUD launch smoke
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.native_target_sha || github.event.pull_request.head.sha }}
          NEXUS_ENABLE_HUD: "1"
          NEXUS_DATA_DIR: ${{ runner.temp }}/nexus-hud-macos-smoke
        run: |
          set -euo pipefail
          HUD_APP="$(find cmd/nexus-hud/build/bin -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$HUD_APP"
          HUD_BIN="$(find "$HUD_APP/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$HUD_BIN"
          log="$RUNNER_TEMP/nexus-hud-macos-smoke.log"
          evidence="$RUNNER_TEMP/nexus-hud-macos-smoke.txt"
          "$HUD_BIN" >"$log" 2>&1 &
          pid=$!
          cleanup() { kill -TERM "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          sleep 8
          kill -0 "$pid"
          {
            echo "sha=$TARGET_SHA"
            echo "pid=$pid"
            echo "platform=darwin"
            echo "status=PASS"
          } >"$evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-${{ github.event_name == 'workflow_dispatch' && inputs.native_target_sha || github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/nexus-desktop_Darwin_arm64.zip
            ${{ runner.temp }}/nexus-hud_Darwin_arm64.zip
            ${{ runner.temp }}/nexus-hud-macos-smoke.txt
            ${{ runner.temp }}/nexus-hud-macos-smoke.log
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-native-evidence-${{ github.event_name == 'workflow_dispatch' && inputs.native_target_sha || github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/nexus-doctor-macos.json
          if-no-files-found: warn
          retention-days: 30

  native-certification:
    name: Seal native certification evidence
    if: (github.event_name == 'workflow_dispatch' && inputs.native_target_sha != '') || (github.event_name == 'pull_request' && github.head_ref == 'feat/hud-cross-platform-completion')
    needs: [native-windows, native-macos]
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-windows-${{ github.event_name == 'workflow_dispatch' && inputs.native_target_sha || github.event.pull_request.head.sha }}
          path: native/windows
      - uses: actions/download-artifact@v4
        with:
          name: desktop-macos-${{ github.event_name == 'workflow_dispatch' && inputs.native_target_sha || github.event.pull_request.head.sha }}
          path: native/macos
      - name: Write exact-SHA certificate
        shell: bash
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.native_target_sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "${#TARGET_SHA}" -eq 40
          printf '%s\n' "$TARGET_SHA" > certified-sha.txt
          sha256sum native/windows/nexus-desktop_Windows_x86_64.zip > windows.sha256
          sha256sum native/windows/nexus-hud_Windows_x86_64.zip > windows-hud.sha256
          sha256sum native/macos/nexus-desktop_Darwin_arm64.zip > macos.sha256
          sha256sum native/macos/nexus-hud_Darwin_arm64.zip > macos-hud.sha256
          {
            printf 'sha=%s\n' "$TARGET_SHA"
            printf 'windows_runner=self-hosted/windows/x64/nexus-windows\n'
            printf 'macos_runner=self-hosted/macos/arm64/nexus-macos\n'
          } > native-certification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-certification-${{ github.event_name == 'workflow_dispatch' && inputs.native_target_sha || github.event.pull_request.head.sha }}
          path: |
            certified-sha.txt
            windows.sha256
            windows-hud.sha256
            macos.sha256
            macos-hud.sha256
            native-certification.txt
          if-no-files-found: error
          retention-days: 30

  snapshot:
    name: GoReleaser Snapshot Build
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    needs: [test-linux, frontend, desktop-linux]
    steps:
      - name: Recover reusable runner workspace
        shell: bash
        run: |
          set -euo pipefail
          stale="$GITHUB_WORKSPACE/../dist-root-stale-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          if [ -d "$GITHUB_WORKSPACE/dist" ]; then
            rm -rf "$GITHUB_WORKSPACE/dist" 2>/dev/null || mv "$GITHUB_WORKSPACE/dist" "$stale"
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --snapshot --clean
      - name: Verify Nexus v1 Linux amd64 artifacts
        run: |
          set -euo pipefail
          test -f dist/checksums.txt
          test -f dist/nexus_Linux_x86_64.tar.gz
          test "$(find dist -maxdepth 1 -name 'nexus_Linux_*.tar.gz' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*_linux_amd64.deb' -o -name '*_linux_x86_64.deb' | wc -l)" -ge 1
          test "$(find dist -maxdepth 1 -name '*.rpm' | wc -l)" -eq 0
          test "$(find dist -maxdepth 1 \( -name '*Darwin*' -o -name '*Windows*' -o -name '*arm64*' \) | wc -l)" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 2

  package-smoke-deb:
    name: Smoke DEB install
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    needs: snapshot
    container: ubuntu:24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snapshot-dist-${{ github.sha }}
          path: /tmp/nexus-package-smoke-dist
      - name: Install DEB and run nexus version
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find /tmp/nexus-package-smoke-dist -maxdepth 1 -name '*_linux_amd64.deb' -o -name '*_linux_x86_64.deb' | head -n1)"
          test -n "$deb"
          if ! dpkg -i "$deb"; then
            apt-get update
            apt-get install -f -y
          fi
          installed_path="$(command -v nexus)"
          test -n "$installed_path"
          nexus version
          dpkg -r nexus
          hash -r
          if [ -e "$installed_path" ]; then
            echo "nexus binary still exists after DEB uninstall: $installed_path" >&2
            exit 1
          fi
          if command -v nexus >/dev/null 2>&1; then
            echo "another nexus command is still resolvable after DEB uninstall: $(command -v nexus)" >&2
            exit 1
          fi
