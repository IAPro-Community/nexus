name: One-shot gofmt Maestro Bridge adapter
on:
  push:
    branches: [feat/maestro-bridge-routing-client-20261102]
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'IAPro-Community/nexus'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: gofmt changed adapter, API and tests
        run: |
          set -euo pipefail
          gofmt -w internal/control/handoff/maestro_project_context.go internal/control/handoff/maestro_routing_preview.go internal/control/handoff/maestro_routing_preview_test.go internal/control/web/handlers_maestro_route_preview.go internal/control/web/routes_projects_agents.go
          go test ./internal/control/handoff ./internal/control/web -count=1
      - name: Remove helper and commit formatted source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/gofmt-maestro-bridge-once-20261102.yml
          git add -- internal/control/handoff/maestro_project_context.go internal/control/handoff/maestro_routing_preview.go internal/control/handoff/maestro_routing_preview_test.go internal/control/web/handlers_maestro_route_preview.go internal/control/web/routes_projects_agents.go
          git diff --cached --name-only
          git commit -m "style(go): format and smoke-test Maestro route Bridge client"
          git push origin "HEAD:feat/maestro-bridge-routing-client-20261102"
