name: One-shot synthetic docs capture on isolated branch
on:
  push:
    branches: [fix/browser-prettier-release-20261102]
permissions:
  contents: write
jobs:
  capture:
    if: github.repository == 'IAPro-Community/nexus'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install frozen web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install isolated Chromium runner
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Capture all required synthetic visuals on exact source SHA
        working-directory: web
        run: bun run docs:capture
      - name: Validate visual manifest against the source SHA
        run: node scripts/docs-verify.mjs
      - name: Commit ONLY verified docs assets and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/recapture-docs-once-20261102.yml
          git add -A -- docs/assets/screenshots/ docs/assets/demos/
          git diff --cached --name-only
          git diff --cached --quiet && { echo "::error::No verified capture changes"; exit 1; }
          git commit -m "docs(visual): recapture synthetic UI evidence for formatted browser source"
          git push origin "HEAD:fix/browser-prettier-release-20261102"
