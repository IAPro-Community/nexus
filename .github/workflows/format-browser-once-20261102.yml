name: One-shot browser formatting on isolated branch
on:
  push:
    branches: [fix/browser-prettier-release-20261102]
permissions:
  contents: write
jobs:
  format-only:
    if: github.repository == 'IAPro-Community/nexus'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install frozen frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Format only two preexisting Browser files
        working-directory: web
        run: bunx prettier --write src/features/browser/BrowserSurface.tsx src/features/browser/BrowserSurface.module.scss
      - name: Verify formatting of the two files
        working-directory: web
        run: bunx prettier --check src/features/browser/BrowserSurface.tsx src/features/browser/BrowserSurface.module.scss
      - name: Commit formatting and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/format-browser-once-20261102.yml
          git add -- web/src/features/browser/BrowserSurface.tsx web/src/features/browser/BrowserSurface.module.scss
          git diff --cached --name-only
          git diff --cached --quiet && { echo "::error::No formatting changes produced"; exit 1; }
          git commit -m "style(browser): apply repository Prettier format only"
          git push origin "HEAD:fix/browser-prettier-release-20261102"
