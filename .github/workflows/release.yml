name: Signed Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v1.0.0-beta.1)
        required: true
        type: string

permissions:
  contents: read
  checks: read
  actions: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  NEXUS_UPDATE_PUBLIC_KEY: ${{ vars.NEXUS_UPDATE_PUBLIC_KEY }}

jobs:
  same-sha-gate:
    name: Same-SHA CI gate
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    outputs:
      ci-run-id: ${{ steps.verify.outputs.ci-run-id }}
    steps:
      - name: Wait for required Nexus 1.0 checks on this SHA
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          required=(
            'Frontend (Format, Lint, Styles, Typecheck, Unit & Build)'
            'Security'
            'Browser E2E, Axe & visual smoke'
            'Linux E2E (Go 1.25.14)'
            'Windows E2E (ConPTY, Named Pipe, PowerShell)'
            'macOS E2E (PTY, Socket, arm64)'
            'Desktop Linux (Wails native build)'
            'Desktop Windows (Wails native build)'
            'Desktop macOS arm64 (Wails native build)'
            'GoReleaser Snapshot Build'
            'Smoke DEB install'
          )
          run_id=''
          for attempt in $(seq 1 60); do
            run_json="$(gh run list --workflow ci.yml --commit "$SHA" --limit 1 --json databaseId,status,conclusion,headSha)"
            run_id="$(jq -r '.[0].databaseId // empty' <<<"$run_json")"
            run_status="$(jq -r '.[0].status // empty' <<<"$run_json")"
            run_conclusion="$(jq -r '.[0].conclusion // empty' <<<"$run_json")"
            run_sha="$(jq -r '.[0].headSha // empty' <<<"$run_json")"
            if [ -n "$run_id" ] && [ "$run_sha" = "$SHA" ] && [ "$run_status" = completed ]; then
              break
            fi
            echo "Waiting for CI for $SHA (attempt $attempt/60; run=${run_id:-none}; status=${run_status:-none})"
            run_id=''
            sleep 30
          done
          test -n "$run_id" || { echo "No completed CI run found for $SHA" >&2; exit 1; }
          test "$run_conclusion" = success || {
            echo "CI run $run_id for $SHA concluded $run_conclusion" >&2
            gh run view "$run_id" --json jobs --jq '.jobs[] | [.name, .conclusion] | @tsv' >&2
            exit 1
          }
          jobs_json="$(gh run view "$run_id" --json jobs)"
          for expected in "${required[@]}"; do
            jq -e --arg expected "$expected" \
              '[.jobs[] | select(.name == $expected and .conclusion == "success")] | length == 1' \
              <<<"$jobs_json" >/dev/null || {
              echo "Missing successful required check: $expected" >&2
              exit 1
            }
          done
          echo "ci-run-id=$run_id" >> "$GITHUB_OUTPUT"

  release:
    needs: same-sha-gate
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    environment: beta-signing
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      - run: test -f internal/control/web/embedded/index.html && test -f internal/control/web/embedded/bundle.js && test -f internal/control/web/embedded/bundle.css
      - run: |
          go test -race ./...
          go vet ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
      - name: Promote same-SHA native desktop artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.same-sha-gate.outputs.ci-run-id }}
        run: |
          set -euo pipefail
          mkdir -p native-artifacts
          gh run download "$CI_RUN_ID" --name "desktop-linux-${GITHUB_SHA}" --dir native-artifacts
          gh run download "$CI_RUN_ID" --name "desktop-windows-${GITHUB_SHA}" --dir native-artifacts
          gh run download "$CI_RUN_ID" --name "desktop-macos-${GITHUB_SHA}" --dir native-artifacts
          test -f native-artifacts/nexus-desktop_Linux_x86_64.tar.gz
          test -f native-artifacts/nexus-desktop_Windows_x86_64.zip
          test -f native-artifacts/nexus-desktop_Darwin_arm64.zip
      - name: Generate signed cross-platform update manifest
        env:
          NEXUS_UPDATE_PRIVATE_KEY: ${{ secrets.NEXUS_UPDATE_PRIVATE_KEY }}
          NEXUS_UPDATE_KEY_ID: ${{ secrets.NEXUS_UPDATE_KEY_ID }}
          NEXUS_UPDATE_PUBLIC_KEY: ${{ vars.NEXUS_UPDATE_PUBLIC_KEY }}
          NEXUS_DIST_REPO: ${{ vars.NEXUS_DIST_REPO }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_VERSION" in v*) ;; *) echo "Release version must be a v-prefixed tag" >&2; exit 1;; esac
          SOURCE_VERSION="v$(tr -d '\r\n' < VERSION)"
          test "$RELEASE_VERSION" = "$SOURCE_VERSION" || {
            echo "Release version $RELEASE_VERSION does not match source VERSION $SOURCE_VERSION" >&2
            exit 1
          }
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG_SHA="$(git rev-list -n1 "$GITHUB_REF_NAME")"
            test "$TAG_SHA" = "$GITHUB_SHA" || {
              echo "Release tag $GITHUB_REF_NAME points to $TAG_SHA, expected $GITHUB_SHA" >&2
              exit 1
            }
          fi
          test -n "$NEXUS_UPDATE_PRIVATE_KEY"
          test -n "$NEXUS_UPDATE_KEY_ID"
          test -n "$NEXUS_UPDATE_PUBLIC_KEY"
          DIST_REPO="${NEXUS_DIST_REPO:-IAPro-Community/nexus-releases}"
          go run ./scripts/sign-update-manifest \
            --dist dist \
            --dist native-artifacts \
            --version "$RELEASE_VERSION" \
            --key-id "$NEXUS_UPDATE_KEY_ID" \
            --private-key "$NEXUS_UPDATE_PRIVATE_KEY" \
            --public-key "$NEXUS_UPDATE_PUBLIC_KEY" \
            --base-url "https://github.com/${DIST_REPO}/releases/download/${RELEASE_VERSION}"
          python3 - <<'PY'
          import json
          manifest = json.load(open('dist/update-manifest.json'))
          required = (
              'linux_amd64',
              'windows_amd64',
              'darwin_arm64',
              'desktop_linux_amd64',
              'desktop_windows_amd64',
              'desktop_darwin_arm64',
          )
          missing = [key for key in required if key not in manifest.get('artifacts', {})]
          if missing:
              raise SystemExit(f'signed manifest missing keys: {missing}')
          PY
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*
            native-artifacts/*
      - name: Stage installers and legal documents
        run: |
          set -euo pipefail
          cp install.sh install.ps1 docs/legal/BETA_TERMS.md docs/legal/PRIVACY.md dist/
      - name: Require public distribution credential
        env:
          NEXUS_DIST_TOKEN: ${{ secrets.NEXUS_DIST_TOKEN }}
        run: |
          test -n "$NEXUS_DIST_TOKEN" || {
            echo "NEXUS_DIST_TOKEN is required to publish the closed-source beta to the public distribution repository" >&2
            exit 1
          }
      - name: Publish immutable release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.NEXUS_DIST_REPO || 'IAPro-Community/nexus-releases' }}
          token: ${{ secrets.NEXUS_DIST_TOKEN }}
          files: |
            dist/*
            native-artifacts/*
          generate_release_notes: true
      - name: Publish signed channel pointer
        env:
          GH_TOKEN: ${{ secrets.NEXUS_DIST_TOKEN }}
          NEXUS_DIST_REPO: ${{ vars.NEXUS_DIST_REPO }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          DIST_REPO="${NEXUS_DIST_REPO:-IAPro-Community/nexus-releases}"
          case "$RELEASE_VERSION" in
            *-beta.*|*-rc.*|*-alpha.*)
              CHANNEL=beta
              ;;
            *)
              CHANNEL=stable
              ;;
          esac
          TAG="channel-${CHANNEL}"
          NOTES="Nexus ${CHANNEL} channel pointer → ${RELEASE_VERSION}. Discovery-only signed update manifest."
          if gh release view "$TAG" --repo "$DIST_REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$DIST_REPO" --yes
          fi
          gh release create "$TAG" --repo "$DIST_REPO" \
            dist/update-manifest.json dist/update-manifest.sig \
            --title "Nexus ${CHANNEL} update channel" --notes "$NOTES" --latest=false
