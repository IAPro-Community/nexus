name: Signed Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example v1.0.0-beta.2)
        required: true
        type: string

permissions:
  contents: read
  checks: read
  actions: read

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  NEXUS_UPDATE_PUBLIC_KEY: ${{ vars.NEXUS_UPDATE_PUBLIC_KEY }}

jobs:
  same-sha-gate:
    name: Same-SHA CI gate
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    outputs:
      ci-run-id: ${{ steps.verify.outputs.ci-run-id }}
      native-ci-run-id: ${{ steps.verify.outputs.native-ci-run-id }}
      native-policy: ${{ steps.verify.outputs.native-policy }}
    steps:
      - name: Wait for required Nexus checks on this SHA
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          required=(
            'Frontend (Format, Lint, Styles, Typecheck, Unit & Build)'
            'Security'
            'Release configuration'
            'Browser E2E, Axe & visual smoke'
            'Linux E2E (Go 1.25.14)'
            'Cross-platform compile guard'
            'Desktop Linux (Wails native build)'
            'GoReleaser Snapshot Build'
            'Smoke DEB install'
          )
          run_id=''
          for attempt in $(seq 1 60); do
            run_json="$(gh run list --workflow ci.yml --commit "$SHA" --limit 20 --json databaseId,status,conclusion,headSha,event)"
            candidate="$(jq -c --arg sha "$SHA" '
              [.[] |
                select(.headSha == $sha) |
                select(.event == "push" or .event == "workflow_dispatch")
              ] |
              sort_by(.databaseId) |
              last // empty
            ' <<<"$run_json")"
            run_id="$(jq -r '.databaseId // empty' <<<"${candidate:-{}}")"
            run_status="$(jq -r '.status // empty' <<<"${candidate:-{}}")"
            run_conclusion="$(jq -r '.conclusion // empty' <<<"${candidate:-{}}")"
            run_sha="$(jq -r '.headSha // empty' <<<"${candidate:-{}}")"
            run_event="$(jq -r '.event // empty' <<<"${candidate:-{}}")"
            if [ -n "$run_id" ] && [ "$run_sha" = "$SHA" ] && [ "$run_status" = completed ]; then
              break
            fi
            echo "Waiting for exact-SHA non-PR CI for $SHA (attempt $attempt/60; run=${run_id:-none}; event=${run_event:-none}; status=${run_status:-none})"
            run_id=''
            sleep 30
          done
          test -n "$run_id" || {
            echo "No completed exact-SHA push/workflow_dispatch CI run found for $SHA. pull_request synthetic-merge runs are not release evidence." >&2
            exit 1
          }
          case "$run_event" in
            push|workflow_dispatch) ;;
            *) echo "Refusing non-exact CI event $run_event for release SHA $SHA" >&2; exit 1 ;;
          esac
          test "$run_conclusion" = success || {
            echo "CI run $run_id for $SHA concluded $run_conclusion" >&2
            gh run view "$run_id" --json jobs --jq '.jobs[] | [.name, .conclusion] | @tsv' >&2
            exit 1
          }
          jobs_json="$(gh run view "$run_id" --json jobs)"
          for expected in "${required[@]}"; do
            jq -e --arg expected "$expected" \
              '[.jobs[] | select(.name == $expected and .conclusion == "success")] | length == 1' \
              <<<"$jobs_json" >/dev/null || {
              echo "Missing successful required check: $expected" >&2
              exit 1
            }
          done
          echo "ci-run-id=$run_id" >> "$GITHUB_OUTPUT"

          RELEASE_VERSION="${{ inputs.version || github.ref_name }}"
          case "$RELEASE_VERSION" in
            v1.0.0-beta.2|v1.0.0-beta.*|v1.0.0-rc.*|v1.0.0)
              native_policy=all
              native_required=('Windows native certification' 'macOS arm64 native certification' 'Seal native certification evidence')
              ;;
            *)
              # Unknown future lines default to the strictest policy.
              native_policy=all
              native_required=('Windows native certification' 'macOS arm64 native certification' 'Seal native certification evidence')
              ;;
          esac
          echo "native-policy=$native_policy" >> "$GITHUB_OUTPUT"

          native_run_id=''
          while IFS= read -r candidate_id; do
            [ -n "$candidate_id" ] || continue
            native_jobs="$(gh run view "$candidate_id" --json jobs)"
            ok=true
            for expected in "${native_required[@]}"; do
              if ! jq -e --arg expected "$expected" \
                '[.jobs[] | select(.name == $expected and .conclusion == "success")] | length == 1' \
                <<<"$native_jobs" >/dev/null; then
                ok=false
                break
              fi
            done
            if [ "$ok" = true ]; then
              native_run_id="$candidate_id"
              break
            fi
          done < <(
            gh run list --workflow ci.yml --commit "$SHA" --event workflow_dispatch --limit 30 \
              --json databaseId,status,conclusion,headSha \
              --jq '.[] | select(.headSha == "'"$SHA"'" and .status == "completed" and .conclusion == "success") | .databaseId'
          )
          test -n "$native_run_id" || {
            echo "Release $RELEASE_VERSION requires exact-SHA native certification policy=$native_policy on $SHA" >&2
            exit 1
          }
          echo "native-ci-run-id=$native_run_id" >> "$GITHUB_OUTPUT"
          echo "Native certification run: $native_run_id (policy=$native_policy)"

          case "$RELEASE_VERSION" in
            *-alpha.*|*-beta.*|*-rc.*)
              echo "Prerelease $RELEASE_VERSION: stable 8h certification is not required."
              ;;
            *)
              certification_json="$(gh run list --workflow stable-certification.yml --commit "$SHA" --limit 20 --json databaseId,status,conclusion,headSha)"
              certification_id="$(jq -r '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success")][0].databaseId // empty' --arg sha "$SHA" <<<"$certification_json")"
              test -n "$certification_id" || {
                echo "Stable release requires a successful Stable Certification workflow on exact SHA $SHA" >&2
                exit 1
              }
              echo "Stable certification run: $certification_id"
              ;;
          esac

  release:
    needs: same-sha-gate
    runs-on: [self-hosted, Linux, X64, nexus-ci]
    environment: beta-signing
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify canonical updater trust root
        run: |
          set -euo pipefail
          canonical="$(tr -d '[:space:]' < UPDATE_PUBLIC_KEY)"
          canonical_key_id="$(tr -d '\r\n[:space:]' < UPDATE_KEY_ID)"
          test "${#canonical}" -eq 64
          test -n "$canonical_key_id"
          test -n "$NEXUS_UPDATE_PUBLIC_KEY"
          test -n "${{ secrets.NEXUS_UPDATE_KEY_ID }}"
          test "$NEXUS_UPDATE_PUBLIC_KEY" = "$canonical" || {
            echo "NEXUS_UPDATE_PUBLIC_KEY does not match UPDATE_PUBLIC_KEY" >&2
            exit 1
          }
          test "${{ secrets.NEXUS_UPDATE_KEY_ID }}" = "$canonical_key_id" || {
            echo "NEXUS_UPDATE_KEY_ID does not match UPDATE_KEY_ID" >&2
            exit 1
          }
          grep -Fq "NEXUS_PUBKEY=\"$canonical\"" install.sh
      - name: Validar identidade da release
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          case "$RELEASE_VERSION" in
            v*) ;;
            *) echo "Release version must be a v-prefixed tag" >&2; exit 1 ;;
          esac
          SOURCE_VERSION="v$(tr -d '\r\n' < VERSION)"
          test "$RELEASE_VERSION" = "$SOURCE_VERSION" || {
            echo "Release version $RELEASE_VERSION does not match source VERSION $SOURCE_VERSION" >&2
            exit 1
          }
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG_SHA="$(git rev-list -n1 "$GITHUB_REF_NAME")"
            test "$TAG_SHA" = "$GITHUB_SHA" || {
              echo "Release tag $GITHUB_REF_NAME points to $TAG_SHA, expected $GITHUB_SHA" >&2
              exit 1
            }
          fi
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.14'
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      - run: test -f internal/control/web/embedded/index.html && test -f internal/control/web/embedded/bundle.js && test -f internal/control/web/embedded/bundle.css
      - run: |
          go test -race ./...
          go vet ./...
      - uses: goreleaser/goreleaser-action@v6
        env:
          GORELEASER_CURRENT_TAG: ${{ inputs.version || github.ref_name }}
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean --skip=publish
      - name: Promote exact-SHA Linux desktop artifact
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.same-sha-gate.outputs.ci-run-id }}
        run: |
          set -euo pipefail
          mkdir -p native-artifacts
          gh run download "$CI_RUN_ID" --name "desktop-linux-${GITHUB_SHA}" --dir native-artifacts
          test -f native-artifacts/nexus-desktop_Linux_x86_64.tar.gz
          test -f native-artifacts/nexus-hud_Linux_x86_64.tar.gz
      - name: Promote exact-SHA certified native artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_CI_RUN_ID: ${{ needs.same-sha-gate.outputs.native-ci-run-id }}
          NATIVE_POLICY: ${{ needs.same-sha-gate.outputs.native-policy }}
        run: |
          set -euo pipefail
          rm -rf native-staging
          mkdir -p native-staging/windows native-staging/macos native-artifacts
          gh run download "$NATIVE_CI_RUN_ID" --name "native-windows-${GITHUB_SHA}" --dir native-staging/windows
          grep -Fxq 'wails-v3.0.0-beta.25' native-staging/windows/native-framework.txt
          cp native-staging/windows/nexus_Windows_x86_64.zip native-artifacts/
          cp native-staging/windows/nexus-desktop_Windows_x86_64.zip native-artifacts/
          cp native-staging/windows/nexus-hud_Windows_x86_64.zip native-artifacts/
          cp native-staging/windows/nexus-setup-Windows_x86_64.exe native-artifacts/
          if [ "$NATIVE_POLICY" = all ]; then
            gh run download "$NATIVE_CI_RUN_ID" --name "native-macos-${GITHUB_SHA}" --dir native-staging/macos
            grep -Fxq 'wails-v3.0.0-beta.25' native-staging/macos/native-framework.txt
            cp native-staging/macos/nexus_Darwin_arm64.tar.gz native-artifacts/
            cp native-staging/macos/nexus-desktop_Darwin_arm64.zip native-artifacts/
            cp native-staging/macos/nexus-hud_Darwin_arm64.zip native-artifacts/
            cp native-staging/macos/nexus-installer_Darwin_arm64.pkg native-artifacts/
          fi
      - name: Stage cross-platform installers before manifest signing
        run: |
          set -euo pipefail
          cp install.sh uninstall.sh install.ps1 uninstall.ps1 dist/
      - name: Generate signed cross-platform update manifest
        env:
          NEXUS_UPDATE_PRIVATE_KEY: ${{ secrets.NEXUS_UPDATE_PRIVATE_KEY }}
          NEXUS_UPDATE_KEY_ID: ${{ secrets.NEXUS_UPDATE_KEY_ID }}
          NEXUS_UPDATE_PUBLIC_KEY: ${{ vars.NEXUS_UPDATE_PUBLIC_KEY }}
          NEXUS_DIST_REPO: ${{ vars.NEXUS_DIST_REPO }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$NEXUS_UPDATE_PRIVATE_KEY"
          test -n "$NEXUS_UPDATE_KEY_ID"
          test -n "$NEXUS_UPDATE_PUBLIC_KEY"
          DIST_REPO="${NEXUS_DIST_REPO:-IAPro-Community/nexus-releases}"
          go run ./scripts/sign-update-manifest \
            --dist dist \
            --dist native-artifacts \
            --version "$RELEASE_VERSION" \
            --key-id "$NEXUS_UPDATE_KEY_ID" \
            --private-key "$NEXUS_UPDATE_PRIVATE_KEY" \
            --public-key "$NEXUS_UPDATE_PUBLIC_KEY" \
            --base-url "https://github.com/${DIST_REPO}/releases/download/${RELEASE_VERSION}"
          NATIVE_POLICY="${{ needs.same-sha-gate.outputs.native-policy }}" python3 - <<'PY'
          import json
          import os
          manifest = json.load(open('dist/update-manifest.json'))
          required = [
              'linux_amd64',
              'desktop_linux_amd64',
              'hud_linux_amd64',
              'windows_amd64',
              'desktop_windows_amd64',
              'hud_windows_amd64',
              'windows_amd64_nsis',
          ]
          if os.environ.get('NATIVE_POLICY') == 'all':
              required.extend([
                  'darwin_arm64',
                  'desktop_darwin_arm64',
                  'hud_darwin_arm64',
                  'darwin_arm64_pkg',
              ])
          missing = [key for key in required if key not in manifest.get('artifacts', {})]
          if missing:
              raise SystemExit(f'signed manifest missing keys: {missing}')
          PY
      - name: Stage legal documents before provenance attestation
        run: |
          set -euo pipefail
          cp docs/legal/BETA_TERMS.md docs/legal/PRIVACY.md dist/
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*
            native-artifacts/*
      - name: Require public distribution credential
        env:
          NEXUS_DIST_TOKEN: ${{ secrets.NEXUS_DIST_TOKEN }}
        run: |
          test -n "$NEXUS_DIST_TOKEN" || {
            echo "NEXUS_DIST_TOKEN is required to publish the closed-source beta to the public distribution repository" >&2
            exit 1
          }
      - name: Publish immutable release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ vars.NEXUS_DIST_REPO || 'IAPro-Community/nexus-releases' }}
          token: ${{ secrets.NEXUS_DIST_TOKEN }}
          tag_name: ${{ inputs.version || github.ref_name }}
          files: |
            dist/*
            native-artifacts/*
          generate_release_notes: true
      - name: Publish signed channel pointer
        env:
          GH_TOKEN: ${{ secrets.NEXUS_DIST_TOKEN }}
          NEXUS_DIST_REPO: ${{ vars.NEXUS_DIST_REPO }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          DIST_REPO="${NEXUS_DIST_REPO:-IAPro-Community/nexus-releases}"
          case "$RELEASE_VERSION" in
            *-beta.*|*-rc.*|*-alpha.*)
              CHANNEL=beta
              ;;
            *)
              CHANNEL=stable
              ;;
          esac
          TAG="channel-${CHANNEL}"
          NOTES="Nexus ${CHANNEL} channel pointer → ${RELEASE_VERSION}. Discovery-only signed update manifest."
          if gh release view "$TAG" --repo "$DIST_REPO" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$DIST_REPO" --yes
          fi
          gh release create "$TAG" --repo "$DIST_REPO" \
            dist/update-manifest.json dist/update-manifest.sig \
            --title "Nexus ${CHANNEL} update channel" --notes "$NOTES" --latest=false
