name: One-shot Maestro composition UI quality and synthetic capture
on:
  push:
    branches: [feat/maestro-compose-flow-preview-20261103]
permissions:
  contents: write
jobs:
  validate:
    if: "${{ github.repository == 'IAPro-Community/nexus' && startsWith(github.event.head_commit.message, 'ci(flow): one-shot Maestro composition UI capture') }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - name: Install frozen frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Format only the affected frontend source files
        working-directory: web
        run: |
          bunx prettier --write src/i18n/resources.ts src/types.ts src/nexus/api.ts \
            src/features/work/FlowDraftEditor.tsx \
            src/features/work/FlowGoalBar.tsx \
            src/features/work/MaestroComposePreview.tsx \
            src/features/work/maestroComposeFlow.ts \
            src/features/work/maestroComposeFlow.test.ts \
            src/features/work/useFlowDraftEditor.ts
      - name: Run targeted test, typecheck, lint and production build
        working-directory: web
        run: |
          bunx vitest run src/features/work/maestroComposeFlow.test.ts
          bun run typecheck
          bun run lint
          bun run lint:styles
          bun run build
      - name: Install real Chromium for synthetic documentation capture
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Capture synthetic visuals using the existing Nexus fixture
        working-directory: web
        run: bun run docs:capture
      - name: Verify screenshot provenance and docs
        run: node scripts/docs-verify.mjs
      - name: Remove one-shot workflow and commit generated evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/validate-maestro-compose-ui-once-20261103.yml
          git add -- web/src/i18n/resources.ts web/src/types.ts web/src/nexus/api.ts
          git add -- web/src/features/work/FlowDraftEditor.tsx
          git add -- web/src/features/work/FlowGoalBar.tsx
          git add -- web/src/features/work/MaestroComposePreview.tsx
          git add -- web/src/features/work/maestroComposeFlow.ts
          git add -- web/src/features/work/maestroComposeFlow.test.ts
          git add -- web/src/features/work/useFlowDraftEditor.ts
          git add -A -- docs/assets/screenshots/ docs/assets/demos/
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "feat(flow): verify Maestro composition UI and refresh synthetic evidence"
          git push origin "HEAD:feat/maestro-compose-flow-preview-20261103"
