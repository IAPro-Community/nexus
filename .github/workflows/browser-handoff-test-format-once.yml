name: Format Browser Handoff Smoke Test (one shot)
on:
  push:
    branches: [release/v1.0.0]
    paths: ['.github/workflows/browser-handoff-test-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.0
          persist-credentials: true
      - name: Format Go integration test
        run: gofmt -w internal/browsercontrol/browser_test.go
      - name: Commit formatted code and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/browser-handoff-test-format-once.yml
          git add internal/browsercontrol/browser_test.go
          git commit -m 'style(browser): format human authentication integration smoke'
          git push origin HEAD:release/v1.0.0
