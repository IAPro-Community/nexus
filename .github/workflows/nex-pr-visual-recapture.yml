name: NEX PR format, test and recapture (temporary)
on:
  push:
    branches:
      - feat/nex-companion-hud-integration-20261103
    paths:
      - .github/workflows/nex-pr-visual-recapture.yml

permissions:
  contents: write

concurrency:
  group: nex-pr-finish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-capture:
    if: github.repository == 'IAPro-Community/nexus'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install locked Web dependencies
        run: bun install --cwd web --frozen-lockfile

      - name: Format only the NEX files reported by Prettier
        shell: bash
        run: |
          set -euo pipefail
          web/node_modules/.bin/prettier --write \
            web/src/features/hud/GuardianMascot.module.scss \
            web/src/features/hud/GuardianMascot.tsx \
            web/src/features/hud/nexCompanionBehavior.test.ts \
            web/src/features/hud/nexCompanionBehavior.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            web/src/features/hud/GuardianMascot.module.scss \
            web/src/features/hud/GuardianMascot.tsx \
            web/src/features/hud/nexCompanionBehavior.test.ts \
            web/src/features/hud/nexCompanionBehavior.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(hud): format NEX Companion code before evidence capture"
          fi

      - name: Execute complete frontend quality gate
        working-directory: web
        run: bun run quality:full

      - name: Install locked Playwright browsers and video codec
        run: |
          web/node_modules/.bin/playwright install --with-deps chromium
          web/node_modules/.bin/playwright install ffmpeg

      - name: Recapture synthetic Web evidence for formatted source SHA
        working-directory: web
        run: bun run docs:capture
        env:
          CI: 'true'

      - name: Verify full documentation and visual provenance
        run: node scripts/docs-verify.mjs

      - name: Commit verified media and push branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- docs/assets/screenshots docs/assets/demos/direct-workflow.webm
          if git diff --cached --quiet; then
            echo "Recapture generated no changes."
            exit 1
          fi
          git diff --cached --name-only
          git commit -m "docs(nex): recapture synthetic Web after NEX formatting"
          git push origin "HEAD:refs/heads/feat/nex-companion-hud-integration-20261103"
