name: NEX PR visual recapture (temporary)

# Temporary, branch-scoped evidence workflow. Not part of the product's
# permanent CI and never publishes or approves the candidate mascot art.
on:
  push:
    branches:
      - feat/nex-companion-hud-integration-20261103
    paths:
      - .github/workflows/nex-pr-visual-recapture.yml
      - web/src/features/hud/**

permissions:
  contents: write

concurrency:
  group: nex-pr-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recapture-synthetic-web:
    if: github.repository == 'IAPro-Community/nexus'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install locked frontend dependencies
        run: bun install --cwd web --frozen-lockfile

      - name: Install headless Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run NEX unit tests before recapture
        working-directory: web
        run: bunx vitest run src/features/hud/nexIdleDirector.test.ts src/features/hud/nexCompanionBehavior.test.ts src/features/hud/GuardianMascot.test.tsx

      - name: Recapture real Web screenshots with synthetic data
        working-directory: web
        run: bun run docs:capture
        env:
          CI: 'true'

      - name: Validate capture provenance before committing
        run: node scripts/docs-verify.mjs

      - name: Commit only generated screenshot evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/assets/screenshots docs/assets/demos/direct-workflow.webm
          if git diff --cached --quiet; then
            echo "No new screenshots were generated."
            exit 1
          fi
          git diff --cached --name-only
          git commit -m "docs(nex): recapture synthetic Web UI after Companion integration"
          git push origin "HEAD:refs/heads/feat/nex-companion-hud-integration-20261103"
