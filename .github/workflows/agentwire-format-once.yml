name: One-time AgentWire Go formatting
on:
  push:
    branches: [release/v1.0.0]
    paths: ['.github/workflows/agentwire-format-once.yml']
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format only AgentWire touched Go source
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/control/agentwire internal/control/host/structured_backend.go internal/control/host/structured_backend_test.go internal/control/host/attention.go internal/control/host/host.go internal/control/host/osc7501*.go internal/control/driver/harness_preview*.go internal/control/driver/structured_command.go internal/control/driver/launch_config.go internal/control/launcher/launcher.go internal/control/web/handlers_api.go
          if git diff --quiet; then
            echo "All targeted files already formatted."
            exit 0
          fi
          git add internal/control/agentwire internal/control/host/structured_backend.go internal/control/host/structured_backend_test.go internal/control/host/attention.go internal/control/host/host.go internal/control/host/osc7501*.go internal/control/driver/harness_preview*.go internal/control/driver/structured_command.go internal/control/driver/launch_config.go internal/control/launcher/launcher.go internal/control/web/handlers_api.go
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "style(agentwire): gofmt structured harness implementation"
          git push origin HEAD:release/v1.0.0
