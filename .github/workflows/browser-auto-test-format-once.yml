name: Browser Auto Runtime Test Formatter (one shot)
on:
  push:
    branches: [release/v1.0.0]
    paths: ['.github/workflows/browser-auto-test-format-once.yml']
permissions:
  contents: write
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.0
      - run: gofmt -w internal/browsercontrol/runtime_capability_test.go
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/browser-auto-test-format-once.yml
          git add internal/browsercontrol/runtime_capability_test.go
          git commit -m 'style(browser): format runtime capability tests'
          git push origin HEAD:release/v1.0.0
