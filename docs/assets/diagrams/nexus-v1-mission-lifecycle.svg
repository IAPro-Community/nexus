<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
<title id="t">Nexus v1 — ciclo da Mission</title><desc id="d">Estados READY, ALLOCATE, COMPILE, EXECUTE, TESTING, REVIEW, VERIFIED, convergência global e COMPLETED_VERIFIED, com retry e intervenção humana.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10132a"/></linearGradient><style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#edf4ff}.m{fill:#a7b7cc}.h{font-size:43px;font-weight:800}.tt{font-size:16px;font-weight:800}.p{font-size:13px;fill:#b8c7db}.b{fill:#0d1c32;stroke:#2489cb;stroke-width:1.4}.v{fill:#1b1638;stroke:#8151d6;stroke-width:1.4}.g{fill:#08372f;stroke:#22c79a;stroke-width:1.4}.r{fill:#341218;stroke:#e45b68;stroke-width:1.4}.o{fill:#382411;stroke:#e79a54;stroke-width:1.4}.a{stroke:#8ca1c1;stroke-width:2;fill:none;marker-end:url(#a)}.retry{stroke:#c084fc;stroke-width:2;fill:none;marker-end:url(#v)}
</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#8ca1c1"/></marker><marker id="v" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#c084fc"/></marker></defs>
<rect width="1280" height="720" fill="url(#bg)"/><text x="44" y="74" class="h">Nexus <tspan fill="#38bdf8">v1</tspan> — Ciclo de execução autônoma</text><text x="44" y="109" font-size="20" class="m">A Mission avança por estado durável, evidência e convergência — não por “done” textual.</text>
<g transform="translate(32 176)">
<g><rect width="125" height="126" rx="14" class="b"/><text x="62" y="50" text-anchor="middle" class="tt">READY</text><text x="62" y="78" text-anchor="middle" class="p">pronta</text></g><path d="M125 63H143" class="a"/>
<g transform="translate(143)"><rect width="125" height="126" rx="14" class="v"/><text x="62" y="50" text-anchor="middle" class="tt">ALLOCATE</text><text x="62" y="78" text-anchor="middle" class="p">Agent + recurso</text></g><path d="M268 63H286" class="a"/>
<g transform="translate(286)"><rect width="125" height="126" rx="14" class="b"/><text x="62" y="50" text-anchor="middle" class="tt">COMPILE</text><text x="62" y="78" text-anchor="middle" class="p">prompt versionado</text></g><path d="M411 63H429" class="a"/>
<g transform="translate(429)"><rect width="125" height="126" rx="14" class="v"/><text x="62" y="50" text-anchor="middle" class="tt">EXECUTE</text><text x="62" y="78" text-anchor="middle" class="p">provider turn</text></g><path d="M554 63H572" class="a"/>
<g transform="translate(572)"><rect width="125" height="126" rx="14" class="b"/><text x="62" y="50" text-anchor="middle" class="tt">TESTING</text><text x="62" y="78" text-anchor="middle" class="p">gates + comandos</text></g><path d="M697 63H715" class="a"/>
<g transform="translate(715)"><rect width="125" height="126" rx="14" class="v"/><text x="62" y="50" text-anchor="middle" class="tt">REVIEW</text><text x="62" y="78" text-anchor="middle" class="p">revisão independente</text></g><path d="M840 63H858" class="a"/>
<g transform="translate(858)"><rect width="125" height="126" rx="14" class="g"/><text x="62" y="50" text-anchor="middle" class="tt">VERIFIED</text><text x="62" y="78" text-anchor="middle" class="p">package aprovada</text></g><path d="M983 63H1001" class="a"/>
<g transform="translate(1001)"><rect width="175" height="126" rx="14" class="g"/><text x="87" y="43" text-anchor="middle" class="tt">GLOBAL DoD</text><text x="87" y="68" text-anchor="middle" class="p">convergência</text><text x="87" y="91" text-anchor="middle" class="tt" fill="#34d399">COMPLETED_VERIFIED</text></g>
<path d="M777 126V174H492V126" class="retry"/><text x="596" y="165" class="p" fill="#c084fc">review rejeitada → remediation</text>
<path d="M634 126V207H492V126" class="retry"/><text x="505" y="199" class="p" fill="#c084fc">teste falhou → retry/replan</text>
</g>
<g transform="translate(42 400)"><rect width="562" height="160" rx="15" class="o"/><text x="22" y="34" font-size="22" font-weight="800">BLOCKED_NEEDS_USER</text><text x="22" y="64" class="p">Intervenção tipada quando o runtime não pode continuar com segurança.</text><text x="22" y="91" class="p">Ex.: side effect externo, outcome desconhecido, mudança material de plano.</text><text x="22" y="122" class="p">A retomada é explícita, versionada e auditável.</text></g>
<g transform="translate(624 400)"><rect width="614" height="160" rx="15" class="b"/><text x="22" y="34" font-size="22" font-weight="800">Critérios de conclusão</text><text x="22" y="65" class="p">✓ todas as packages necessárias em VERIFIED</text><text x="22" y="89" class="p">✓ Definition of Done global aprovada</text><text x="22" y="113" class="p">✓ nenhuma intervenção pendente</text><text x="22" y="137" class="p">✓ WorkReceipts e evidências persistidos</text></g>
<text x="44" y="670" font-size="14" class="m">Mission lifecycle • retry controlado • recovery/restart • PT-BR</text></svg>