<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
<title id="t">Nexus v1 — coordenação entre agentes</title><desc id="d">Solicitação tipada passa pelo MissionRunner, tenta memória e artefatos e, se necessário, cria trabalho auxiliar e devolve WorkReceipt ao agente de origem.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10132a"/></linearGradient><style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#edf4ff}.m{fill:#a7b7cc}.h{font-size:44px;font-weight:800}.tt{font-size:17px;font-weight:750}.p{font-size:14px;fill:#b8c7db}.b{fill:#0d1c32;stroke:#2489cb;stroke-width:1.4}.v{fill:#1b1638;stroke:#8151d6;stroke-width:1.4}.g{fill:#08372f;stroke:#22c79a;stroke-width:1.4}.r{fill:#341218;stroke:#e45b68;stroke-width:1.4}.a{stroke:#8ca1c1;stroke-width:2;fill:none;marker-end:url(#a)}.back{stroke:#3dd8b0;stroke-width:2;fill:none;marker-end:url(#g)}
</style><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#8ca1c1"/></marker><marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#3dd8b0"/></marker></defs>
<rect width="1280" height="720" fill="url(#bg)"/><text x="44" y="76" class="h">Nexus <tspan fill="#38bdf8">v1</tspan> — Coordenação entre agentes</text><text x="44" y="111" font-size="20" class="m">Comunicação tipada, persistente e segura dentro da Mission.</text>
<g transform="translate(40 166)">
<rect x="0" y="76" width="175" height="108" rx="14" class="b"/><text x="87" y="112" text-anchor="middle" class="tt">Agente de origem</text><text x="87" y="138" text-anchor="middle" class="p">precisa de contexto,</text><text x="87" y="158" text-anchor="middle" class="p">artefato ou especialista</text>
<path d="M175 130H214" class="a"/>
<rect x="214" y="76" width="190" height="108" rx="14" class="v"/><text x="309" y="111" text-anchor="middle" class="tt">Request tipado</text><text x="309" y="138" text-anchor="middle" class="p">NEED_INFO / DELEGATE</text><text x="309" y="158" text-anchor="middle" class="p">ARTIFACT / REVIEW</text>
<path d="M404 130H443" class="a"/>
<rect x="443" y="61" width="190" height="138" rx="14" class="v"/><text x="538" y="111" text-anchor="middle" class="tt">MissionRunner</text><text x="538" y="138" text-anchor="middle" class="p">valida política, persiste</text><text x="538" y="158" text-anchor="middle" class="p">e mantém idempotência</text>
<path d="M633 130H674" class="a"/>
<polygon points="744,64 814,130 744,196 674,130" fill="#0d1c32" stroke="#2489cb" stroke-width="1.5"/><text x="744" y="121" text-anchor="middle" class="tt">Resolver</text><text x="744" y="142" text-anchor="middle" class="tt">localmente?</text>
<path d="M744 64V27H860" class="a"/><text x="776" y="48" class="p" fill="#34d399">SIM</text>
<rect x="860" y="0" width="330" height="90" rx="14" class="b"/><text x="1025" y="31" text-anchor="middle" class="tt">Memory / Artifacts / WorkReceipts</text><text x="1025" y="56" text-anchor="middle" class="p">reutiliza contexto durável antes de acordar outro Agent</text>
<path d="M814 130H850" class="a"/><text x="821" y="118" class="p" fill="#c084fc">NÃO</text>
<rect x="850" y="105" width="160" height="80" rx="14" class="v"/><text x="930" y="137" text-anchor="middle" class="tt">Child package</text><text x="930" y="160" text-anchor="middle" class="p">trabalho delimitado</text>
<path d="M1010 145H1032" class="a"/><rect x="1032" y="105" width="158" height="80" rx="14" class="b"/><text x="1111" y="137" text-anchor="middle" class="tt">Scheduler + Agent</text><text x="1111" y="160" text-anchor="middle" class="p">recurso adequado</text>
<path d="M1111 185V226" class="a"/><rect x="1015" y="226" width="175" height="78" rx="14" class="v"/><text x="1102" y="257" text-anchor="middle" class="tt">WorkReceipt</text><text x="1102" y="280" text-anchor="middle" class="p">resultado + evidência</text>
<path d="M1015 265H840" class="back"/><rect x="645" y="226" width="195" height="78" rx="14" class="g"/><text x="742" y="257" text-anchor="middle" class="tt">ContextCapsule</text><text x="742" y="280" text-anchor="middle" class="p">contexto atualizado</text>
<path d="M645 265H440" class="back"/><path d="M440 265H88V184" class="back"/>
</g>
<g transform="translate(40 508)"><rect width="760" height="126" rx="15" fill="#0b1627" stroke="#1f5f8d"/><text x="22" y="33" font-size="22" font-weight="800">Operações fechadas da v1</text>
<g transform="translate(22 52)"><rect width="165" height="51" rx="10" class="b"/><text x="82" y="32" text-anchor="middle" class="tt">NEED_INFO</text></g>
<g transform="translate(199 52)"><rect width="165" height="51" rx="10" class="b"/><text x="82" y="32" text-anchor="middle" class="tt">ARTIFACT_REQUEST</text></g>
<g transform="translate(376 52)"><rect width="165" height="51" rx="10" class="v"/><text x="82" y="32" text-anchor="middle" class="tt">REVIEW_REQUEST</text></g>
<g transform="translate(553 52)"><rect width="165" height="51" rx="10" class="v"/><text x="82" y="32" text-anchor="middle" class="tt">DELEGATE</text></g></g>
<g transform="translate(824 508)"><rect width="416" height="126" rx="15" class="r"/><text x="22" y="33" font-size="22" font-weight="800">Falha fechada</text><text x="22" y="62" class="p">• replay sem prova positiva de segurança</text><text x="22" y="84" class="p">• workspace mudou antes do pedido</text><text x="22" y="106" class="p">• contrato permite side effects externos</text></g>
<text x="44" y="677" font-size="14" class="m">Coordenação conversacional da Mission • PT-BR</text></svg>