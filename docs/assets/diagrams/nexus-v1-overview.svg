<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">Nexus v1 — visão geral</title>
<desc id="desc">Do objetivo ao resultado verificado: Composer, WorkPlan, Flow, GO, MissionRunner, agentes e evidências.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10132a"/></linearGradient>
  <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#0ea5e9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <linearGradient id="violet" x1="0" x2="1"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  <linearGradient id="green" x1="0" x2="1"><stop stop-color="#059669"/><stop offset="1" stop-color="#10b981"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e8eef9}
    .muted{fill:#9fb0c8}.tiny{font-size:14px;letter-spacing:2px}.h1{font-size:48px;font-weight:800}.h2{font-size:25px;font-weight:750}.label{font-size:18px;font-weight:700}.sub{font-size:15px;fill:#b6c4d8}
    .panel{fill:#0b1627;stroke:#1f5f8d;stroke-width:1.5}.panel2{fill:#171331;stroke:#7048c8;stroke-width:1.5}.box{fill:#0d1c32;stroke:#2583c7;stroke-width:1.5}.boxv{fill:#1b1638;stroke:#8653dc;stroke-width:1.5}.boxg{fill:#08372f;stroke:#22c79a;stroke-width:1.5}
    .arrow{stroke:#8298b7;stroke-width:2;fill:none;marker-end:url(#a)}.call{stroke:#9f68ff;stroke-width:1.6;fill:none}
  </style>
  <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#8298b7"/></marker>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/>
<text x="52" y="40" class="tiny muted">AUTOMATIZAR • PLANEJAR • EXECUTAR • COMPROVAR</text>
<text x="52" y="100" class="h1">Nexus <tspan fill="#38bdf8">v1</tspan> — Visão geral</text>
<text x="52" y="136" font-size="21" class="muted">Orquestração visual e execução autônoma com agentes, evidência e governança.</text>

<rect x="42" y="170" rx="18" width="1196" height="444" class="panel"/>
<text x="66" y="208" class="h2">Fluxo canônico</text>
<text x="66" y="234" class="sub">O WorkPlan é a fonte de verdade; o Flow é sua projeção visual; a Mission executa o plano aprovado.</text>

<g transform="translate(68 295)">
  <rect width="145" height="88" rx="14" class="box"/><text x="72" y="36" text-anchor="middle" class="label">Objetivo</text><text x="72" y="61" text-anchor="middle" class="sub">Prompt + contexto</text>
  <path d="M145 44H178" class="arrow"/>
  <g transform="translate(178)"><rect width="145" height="88" rx="14" class="boxv"/><text x="72" y="36" text-anchor="middle" class="label">Composer</text><text x="72" y="61" text-anchor="middle" class="sub">Refina e valida</text></g>
  <path d="M323 44H356" class="arrow"/>
  <g transform="translate(356)"><rect width="145" height="88" rx="14" class="box"/><text x="72" y="34" text-anchor="middle" class="label">WorkPlan</text><text x="72" y="60" text-anchor="middle" class="sub">Fonte de verdade</text></g>
  <path d="M501 44H534" class="arrow"/>
  <g transform="translate(534)"><rect width="125" height="88" rx="14" class="boxv"/><text x="62" y="36" text-anchor="middle" class="label">Flow</text><text x="62" y="61" text-anchor="middle" class="sub">Visual + editável</text></g>
  <path d="M659 44H692" class="arrow"/>
  <g transform="translate(692)"><rect width="100" height="88" rx="14" class="boxg" filter="url(#glow)"/><text x="50" y="53" text-anchor="middle" class="label">GO</text></g>
  <path d="M792 44H825" class="arrow"/>
  <g transform="translate(825)"><rect width="155" height="88" rx="14" class="boxv"/><text x="77" y="36" text-anchor="middle" class="label">MissionRunner</text><text x="77" y="61" text-anchor="middle" class="sub">Estado durável</text></g>
  <path d="M980 44H1013" class="arrow"/>
  <g transform="translate(1013)"><rect width="125" height="88" rx="14" class="box"/><text x="62" y="36" text-anchor="middle" class="label">Agentes</text><text x="62" y="61" text-anchor="middle" class="sub">Especialistas</text></g>
</g>

<g transform="translate(728 426)">
  <rect x="0" y="0" width="160" height="60" rx="12" class="box"/><text x="80" y="26" text-anchor="middle" class="label">Scheduler</text><text x="80" y="46" text-anchor="middle" class="sub">provider/profile/model</text>
  <rect x="178" y="0" width="160" height="60" rx="12" class="box"/><text x="258" y="26" text-anchor="middle" class="label">Worktrees</text><text x="258" y="46" text-anchor="middle" class="sub">isolamento</text>
  <rect x="356" y="0" width="160" height="60" rx="12" class="boxv"/><text x="436" y="26" text-anchor="middle" class="label">Evidências</text><text x="436" y="46" text-anchor="middle" class="sub">receipts + artifacts</text>
</g>
<path d="M905 383V426" class="call"/><path d="M905 383L986 426" class="call"/><path d="M905 383L1164 426" class="call"/>

<g transform="translate(68 500)">
  <rect width="610" height="82" rx="14" class="panel2"/>
  <text x="24" y="30" class="label">Critério de conclusão</text>
  <text x="24" y="56" class="sub">Todas as packages verificadas + DoD global + zero intervenção pendente = </text>
  <text x="500" y="56" font-size="15" font-weight="800" fill="#34d399">COMPLETED_VERIFIED</text>
</g>
<text x="52" y="668" class="tiny muted">NEXUS v1 • CONTEXTO • EXECUÇÃO • EVIDÊNCIA • RESULTADOS VERIFICÁVEIS</text>
</svg>