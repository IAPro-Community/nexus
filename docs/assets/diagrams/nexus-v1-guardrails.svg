<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
<title id="t">Nexus v1 — segurança e guardrails</title><desc id="d">Falha fechada, autonomia controlada, intervenção humana, evidência e boundary de replay.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10132a"/></linearGradient><style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#edf4ff}.m{fill:#a7b7cc}.h{font-size:44px;font-weight:800}.hh{font-size:22px;font-weight:800}.p{font-size:15px;fill:#bdc9dc}.b{fill:#0d1c32;stroke:#2489cb;stroke-width:1.4}.v{fill:#1b1638;stroke:#8151d6;stroke-width:1.4}.g{fill:#08372f;stroke:#22c79a;stroke-width:1.4}.r{fill:#341218;stroke:#e45b68;stroke-width:1.4}
</style></defs><rect width="1280" height="720" fill="url(#bg)"/><text x="44" y="76" class="h">Nexus <tspan fill="#38bdf8">v1</tspan> — Segurança e guardrails</text><text x="44" y="111" font-size="20" class="m">Autonomia com limites explícitos, prova positiva e falha fechada.</text>
<g transform="translate(38 158)">
<rect width="570" height="188" rx="16" class="b"/><text x="24" y="40" class="hh">Boundary de replay</text><text x="24" y="74" class="p">Continuação automática só acontece quando:</text><text x="38" y="103" class="p">✓ fingerprint do workspace permanece idêntico</text><text x="38" y="130" class="p">✓ contrato proíbe push, deploy, rede, secrets e paid services</text><text x="38" y="157" class="p">✓ não há evidência de side effect antes do pedido</text>
<g transform="translate(594)"><rect width="610" height="188" rx="16" class="v"/><text x="24" y="40" class="hh">Autonomia controlada</text><text x="38" y="75" class="p">• allowed file patterns e worktree isolado</text><text x="38" y="102" class="p">• retries e budget de tentativas</text><text x="38" y="129" class="p">• ResourceScheduler aplica policy e capacidades</text><text x="38" y="156" class="p">• provider nunca recebe permissão implícita de push/deploy</text></g>
<g transform="translate(0 212)"><rect width="570" height="188" rx="16" class="r"/><text x="24" y="40" class="hh">Intervenção humana</text><text x="38" y="78" class="p">COORDINATION_REPLAY_UNPROVEN</text><text x="38" y="106" class="p">DISPATCH_OUTCOME_UNKNOWN</text><text x="38" y="134" class="p">BLOCKED_NEEDS_USER</text><text x="38" y="162" class="p">→ contexto + impacto + opções explícitas de retomada</text></g>
<g transform="translate(594 212)"><rect width="610" height="188" rx="16" class="v"/><text x="24" y="40" class="hh">Evidência e rastreabilidade</text><text x="38" y="78" class="p">• PromptArtifact / versão congelada</text><text x="38" y="106" class="p">• ContextCapsule e WorkReceipt</text><text x="38" y="134" class="p">• artifacts, findings, comandos e verificações</text><text x="38" y="162" class="p">• lineage de Agent, provider, package e Mission</text></g></g>
<g transform="translate(38 594)"><rect width="1204" height="72" rx="14" fill="#0b1627" stroke="#1f5f8d"/><text x="24" y="44" class="hh">Princípios:</text>
<text x="176" y="44" class="p" fill="#38bdf8">FAIL CLOSED</text><text x="340" y="44" class="p" fill="#c084fc">DETERMINISMO</text><text x="530" y="44" class="p" fill="#34d399">REPRODUTIBILIDADE</text><text x="760" y="44" class="p" fill="#38bdf8">AUDITABILIDADE</text><text x="960" y="44" class="p" fill="#c084fc">MENOR PRIVILÉGIO</text></g>
</svg>