version: "2"

linters:
  default: standard
  disable:
    - errcheck
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - whitespace
    - copyloopvar
    - durationcheck

  settings:
    govet:
      disable:
        - fieldalignment
    misspell:
      locale: US

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - unparam
      - path: internal/nexus/composer_brief.go
        linters:
          - misspell
      - path: internal/nexus/promotion/promoter.go
        linters:
          - misspell
      - path: internal/app/interactive_submit.go
        linters:
          - unparam
      - path: internal/desktop/hud_window.go
        linters:
          - staticcheck

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
