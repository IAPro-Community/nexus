version: "2"

linters:
  default: standard
  disable:
    - errcheck
  enable:
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - unparam
    - whitespace
    - copyloopvar
    - durationcheck

  settings:
    govet:
      disable:
        - fieldalignment
    misspell:
      locale: US

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - unparam
      - path: internal/nexus/composer_brief.go
        linters:
          - misspell
      - path: internal/nexus/promotion/promoter.go
        linters:
          - misspell
      # pt-BR product copy and fixtures intentionally use words that the US
      # dictionary reports as misspellings.
      - path: internal/nexus/composer\.go
        linters:
          - misspell
      - path: internal/nexus/composer_flow_handoff_v1_test\.go
        linters:
          - misspell
      # "cancelled" is the persisted handoff status consumed by the browser MCP and ACP protocol.
      - path: internal/browsercontrol/browser_collaboration(_test)?\.go
        linters:
          - misspell
      - path: internal/control/web/handlers_browser_mcp\.go
        linters:
          - misspell
      - path: internal/control/agentwire/.*
        linters:
          - misspell
      - path: internal/control/host/attention\.go
        linters:
          - misspell
      - path: internal/app/interactive_submit.go
        linters:
          - unparam
      - path: internal/desktop/hud_window.go
        linters:
          - staticcheck

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
